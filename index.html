<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVault - Modern Letterboxd Style</title>
    <style>
        :root {
            --bg-color: #14181c;
            --card-bg: #1b222c;
            --accent: #00e054;
            --accent-hover: #00c046;
            --text-main: #9ab;
            --text-white: #fff;
            --border-color: #2c3440;
            --danger: #ff8000;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 10px;
        }
        .wrapper {
            max-width: 1100px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 {
            color: var(--text-white);
            margin: 0;
            font-size: 24px;
            font-weight: 800;
        }
        h1 span { color: var(--accent); }

        /* Modern Menu / Tab Toggle Bar */
        .menu-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            overflow-x: auto;
        }
        .menu-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .menu-btn.active, .menu-btn:hover {
            background: var(--accent);
            color: #14181c;
            border-color: var(--accent);
        }

        .action-toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }
        .toolbar-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-white);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: border-color 0.2s;
        }
        .toolbar-btn:hover { border-color: var(--accent); }

        .search-container {
            margin-bottom: 25px;
            text-align: center;
        }
        input[type="text"] {
            width: 100%;
            max-width: 600px;
            padding: 14px 20px;
            font-size: 15px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
        }
        input[type="text"]:focus { border-color: var(--accent); }

        .section-title {
            margin: 25px 0 15px 0;
            font-size: 18px;
            color: var(--text-white);
            font-weight: 700;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        }
        .card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            border: 2px solid transparent;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        @media (min-width: 768px) {
            .card img { height: 230px; }
        }
        .card h4 {
            font-size: 13px;
            margin: 10px 8px;
            height: 32px;
            overflow: hidden;
            color: var(--text-white);
        }

        .content-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        .content-section.active-tab {
            display: block;
        }

        .row-item {
            display: flex;
            align-items: center;
            background: #14181c;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 10px;
            gap: 15px;
            cursor: pointer;
        }
        .row-item img {
            width: 45px;
            height: 65px;
            object-fit: cover;
            border-radius: 4px;
        }

        /* Letterboxd Style Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 13, 16, 0.9);
            backdrop-filter: blur(8px);
            overflow-y: auto;
        }
        .modal-content {
            background-color: #12181f;
            margin: 3% auto;
            width: 92%;
            max-width: 800px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        .close-btn {
            color: #fff;
            position: absolute;
            right: 15px;
            top: 15px;
            font-size: 20px;
            background: rgba(0,0,0,0.6);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            border: 1px solid var(--border-color);
        }
        .close-btn:hover { background: var(--danger); }

        .lb-banner {
            position: relative;
            width: 100%;
            height: 220px;
            background-size: cover;
            background-position: center;
        }
        @media (min-width: 768px) {
            .lb-banner { height: 320px; }
        }
        .lb-banner::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 80px;
            background: linear-gradient(to top, #12181f, transparent);
        }
        .lb-header-details {
            padding: 0 20px 20px 20px;
            margin-top: -45px;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        @media (min-width: 600px) {
            .lb-header-details { flex-direction: row; align-items: flex-end; justify-content: space-between; }
        }
        .lb-title-group h2 {
            margin: 0 0 5px 0;
            color: var(--text-white);
            font-size: 22px;
            font-weight: 800;
        }
        @media (min-width: 768px) {
            .lb-title-group h2 { font-size: 28px; }
        }
        .lb-title-group p { margin: 0; font-size: 13px; color: var(--text-main); }
        .lb-poster-thumb {
            width: 90px;
            height: 135px;
            border-radius: 6px;
            border: 2px solid #fff;
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            display: none;
        }
        @media (min-width: 600px) {
            .lb-poster-thumb { display: block; }
        }

        .lb-action-bar {
            display: flex;
            justify-content: space-around;
            background: #18202a;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 0;
        }
        .lb-action-btn {
            background: none;
            border: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: color 0.2s;
        }
        .lb-action-btn svg { width: 22px; height: 22px; fill: currentColor; }
        .lb-action-btn:hover, .lb-action-btn.active { color: var(--accent); }

        .lb-rating-section {
            text-align: center;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        .stars {
            display: inline-flex;
            gap: 5px;
            cursor: pointer;
            font-size: 22px;
            color: #456;
        }
        .stars span.active { color: #00e054; }

        .lb-body-section { padding: 20px; }
        .cast-row {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .cast-item { min-width: 70px; text-align: center; font-size: 11px; }
        .cast-item img {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }

        /* Date Picker Modal Style */
        .date-modal-box {
            background: var(--card-bg);
            margin: 20% auto;
            padding: 25px;
            width: 90%;
            max-width: 380px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }
        input[type="date"] {
            width: 100%;
            background: #14181c;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            margin-top: 15px;
            box-sizing: border-box;
            color-scheme: dark;
            outline: none;
        }
        .loader-trigger {
            height: 30px;
            text-align: center;
            color: var(--text-main);
            font-size: 13px;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <h1>Cine<span>Vault</span></h1>
            <div id="syncStatus" style="font-size: 13px; color: var(--accent);">🟢 Active</div>
        </header>

        <div class="menu-bar">
            <button class="menu-btn active" onclick="switchTab('movies', this)">🎬 Movies</button>
            <button class="menu-btn" onclick="switchTab('tv', this)">📺 TV Shows</button>
            <button class="menu-btn" onclick="switchTab('diary', this)">📖 Watched Diary</button>
            <button class="menu-btn" onclick="switchTab('watchlist', this)">🗓️ Watchlist</button>
        </div>

        <div class="action-toolbar">
            <button class="toolbar-btn" onclick="pickRandomMovie()">
                🎲 Random Picker
            </button>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search movies, tv series..." oninput="searchMedia()">
        </div>
        <div id="searchResults" class="grid"></div>

        <div id="tab-movies" class="content-section active-tab" style="background:transparent; border:none; padding:0;">
            <h2 class="section-title" style="margin-top:0;">Top Movies</h2>
            <div id="moviesGrid" class="grid"></div>
            <div id="moviesLoader" class="loader-trigger">Loading more movies...</div>
        </div>

        <div id="tab-tv" class="content-section" style="background:transparent; border:none; padding:0;">
            <h2 class="section-title" style="margin-top:0;">Top TV Shows</h2>
            <div id="tvGrid" class="grid"></div>
            <div id="tvLoader" class="loader-trigger">Loading more TV shows...</div>
        </div>

        <div id="tab-diary" class="content-section">
            <h2 class="section-title" style="margin-top:0;">📖 Watched Diary</h2>
            <div id="diaryContainer"><p style="font-size: 13px;">No movies watched yet.</p></div>
        </div>

        <div id="tab-watchlist" class="content-section">
            <h2 class="section-title" style="margin-top:0;">🗓️ Watchlist / Schedule</h2>
            <div id="watchlistContainer"><p style="font-size: 13px;">No movies in watchlist.</p></div>
        </div>
    </div>

    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&#10005;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <div id="dateModal" class="modal">
        <div class="date-modal-box">
            <h3 id="dateModalTitle" style="color:#fff; margin-top:0; font-size:16px;">Select Date</h3>
            <p id="dateModalMovieName" style="color:var(--accent); font-size:14px; font-weight:bold;"></p>
            <input type="date" id="selectedDateInput">
            <button onclick="confirmDateSelection()" style="margin-top:20px; width:100%; background:var(--accent); border:none; padding:12px; border-radius:8px; font-weight:bold; color:#14181c; cursor:pointer;">Confirm & Save</button>
            <button onclick="closeDateModal()" style="margin-top:8px; width:100%; background:transparent; border:1px solid var(--border-color); padding:10px; border-radius:8px; color:var(--text-main); cursor:pointer;">Cancel</button>
        </div>
    </div>

    <script>
        const TMDB_API_KEY = '9c95420163879f1c4726c540b305cbc6';
        const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';
        const BACKDROP_BASE_URL = 'https://image.tmdb.org/t/p/original';

        let activeMovieObj = null;
        let activeTargetType = '';
        
        let moviePage = 1;
        let tvPage = 1;
        let currentTab = 'movies';

        initApp();

        function initApp() {
            loadMediaData('movie');
            loadMediaData('tv');
            renderLists();
            setupInfiniteScroll();
        }

        function switchTab(tabName, btn) {
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active-tab'));
            
            btn.classList.add('active');
            currentTab = tabName;

            if(tabName === 'movies' || tabName === 'tv') {
                document.getElementById('tab-' + tabName).classList.add('active-tab');
            } else {
                document.getElementById('tab-' + tabName).classList.add('active-tab');
            }
        }

        async function loadMediaData(type) {
            try {
                let page = type === 'movie' ? moviePage : tvPage;
                const res = await fetch(`https://api.themoviedb.org/3/${type}/top_rated?api_key=${TMDB_API_KEY}&page=${page}`);
                const data = await res.json();
                
                appendMediaCards(data.results, type === 'movie' ? 'moviesGrid' : 'tvGrid', type);
            } catch (err) { console.error(err); }
        }

        function appendMediaCards(items, elementId, mediaType) {
            const container = document.getElementById(elementId);
            items.forEach(item => {
                if (!item.poster_path) return;
                const title = item.title || item.name;
                const date = item.release_date || item.first_air_date || '';
                const year = date ? date.split('-')[0] : '';

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openDetails(item.id, mediaType);
                card.innerHTML = `
                    <img src="${IMAGE_BASE_URL + item.poster_path}" alt="${title}">
                    <h4>${title} ${year ? '('+year+')' : ''}</h4>
                `;
                container.appendChild(card);
            });
        }

        function setupInfiniteScroll() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        if (currentTab === 'movies') {
                            moviePage++;
                            loadMediaData('movie');
                        } else if (currentTab === 'tv') {
                            tvPage++;
                            loadMediaData('tv');
                        }
                    }
                });
            }, { threshold: 1.0 });

            observer.observe(document.getElementById('moviesLoader'));
            observer.observe(document.getElementById('tvLoader'));
        }

        async function pickRandomMovie() {
            const randomPage = Math.floor(Math.random() * 10) + 1;
            const type = currentTab === 'tv' ? 'tv' : 'movie';
            try {
                const res = await fetch(`https://api.themoviedb.org/3/${type}/top_rated?api_key=${TMDB_API_KEY}&page=${randomPage}`);
                const data = await res.json();
                const items = data.results.filter(m => m.poster_path);
                if (items.length > 0) {
                    const chosen = items[Math.floor(Math.random() * items.length)];
                    openDetails(chosen.id, type);
                }
            } catch (err) { console.error(err); }
        }

        async function searchMedia() {
            const query = document.getElementById('searchInput').value;
            const resultsDiv = document.getElementById('searchResults');
            if (!query.trim()) { resultsDiv.innerHTML = ''; return; }

            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`);
                const data = await res.json();
                
                resultsDiv.innerHTML = '';
                data.results.forEach(item => {
                    if (!item.poster_path || item.media_type === 'person') return;
                    const title = item.title || item.name;
                    const date = item.release_date || item.first_air_date || '';
                    const year = date ? date.split('-')[0] : '';

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => openDetails(item.id, item.media_type);
                    card.innerHTML = `
                        <img src="${IMAGE_BASE_URL + item.poster_path}" alt="${title}">
                        <h4>${title} ${year ? '('+year+')' : ''}</h4>
                    `;
                    resultsDiv.appendChild(card);
                });
            } catch (err) { console.error(err); }
        }

        async function openDetails(id, type) {
            const modal = document.getElementById('detailsModal');
            const modalBody = document.getElementById('modalBody');
            modal.style.display = 'block';
            modalBody.innerHTML = '<p style="text-align:center; padding:40px; color:var(--accent);">Loading...</p>';

            try {
                const [detailRes, creditRes] = await Promise.all([
                    fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${TMDB_API_KEY}`),
                    fetch(`https://api.themoviedb.org/3/${type}/${id}/credits?api_key=${TMDB_API_KEY}`)
                ]);
                const details = await detailRes.json();
                const credits = await creditRes.json();

                details.media_type = type;
                activeMovieObj = details;

                const title = details.title || details.name;
                const year = (details.release_date || details.first_air_date || '').split('-')[0];
                const backdrop = details.backdrop_path ? BACKDROP_BASE_URL + details.backdrop_path : '';
                const poster = details.poster_path ? IMAGE_BASE_URL + details.poster_path : '';
                const director = credits.crew ? (credits.crew.find(c => c.job === 'Director') || {}).name : '';
                const cast = credits.cast ? credits.cast.slice(0, 10) : [];

                let watchedList = JSON.parse(localStorage.getItem('cineVaultWatched')) || [];
                let watchlist = JSON.parse(localStorage.getItem('cineVaultWatchlist')) || [];
                let isWatched = watchedList.some(m => m.id === id);
                let isInWatchlist = watchlist.some(m => m.id === id);

                modalBody.innerHTML = `
                    <div class="lb-banner" style="background-image: url('${backdrop}')"></div>
                    <div class="lb-header-details">
                        <div class="lb-title-group">
                            <h2>${title}</h2>
                            <p>${year} ${director ? '· Directed by ' + director : ''}</p>
                        </div>
                        <img src="${poster}" class="lb-poster-thumb" alt="${title}">
                    </div>

                    <div class="lb-action-bar">
                        <button class="lb-action-btn ${isWatched ? 'active' : ''}" onclick="triggerDateModal('watched')">
                            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                            Watched
                        </button>
                        <button class="lb-action-btn" onclick="toggleLike(this)">
                            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            Like
                        </button>
                        <button class="lb-action-btn ${isInWatchlist ? 'active' : ''}" onclick="triggerDateModal('watchlist')">
                            <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15l-5-2.18L7 18V5h10v13z"/></svg>
                            Watchlist
                        </button>
                    </div>

                    <div class="lb-rating-section">
                        <div class="stars" id="starContainer">
                            <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
                        </div>
                        <div style="font-size: 11px; margin-top: 5px; color: var(--text-main);">Rate</div>
                    </div>

                    <div class="lb-body-section">
                        <h3 style="color:#fff; font-size:15px; margin-top:0;">Overview</h3>
                        <p style="font-size:13px; line-height:1.5; color: var(--text-main);">${details.overview || 'No description available.'}</p>
                        
                        <h3 style="color:#fff; font-size:15px; margin-top:20px;">Top Cast</h3>
                        <div class="cast-row">
                            ${cast.map(actor => `
                                <div class="cast-item">
                                    <img src="${actor.profile_path ? IMAGE_BASE_URL + actor.profile_path : 'https://via.placeholder.com/65'}" alt="${actor.name}">
                                    <div style="margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${actor.name}">${actor.name}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                setupStarRating();
            } catch (err) {
                modalBody.innerHTML = '<p style="text-align:center; color:orange; padding:30px;">Failed to load details.</p>';
            }
        }

        function triggerDateModal(type) {
            activeTargetType = type;
            const title = activeMovieObj.title || activeMovieObj.name;
            document.getElementById('dateModalTitle').innerText = type === 'watched' ? 'Mark as Watched' : 'Add to Watchlist';
            document.getElementById('dateModalMovieName').innerText = title;
            document.getElementById('selectedDateInput').value = new Date().toISOString().split('T')[0];
            document.getElementById('dateModal').style.display = 'block';
        }

        function closeDateModal() {
            document.getElementById('dateModal').style.display = 'none';
        }

        function confirmDateSelection() {
            const dateVal = document.getElementById('selectedDateInput').value;
            const storageKey = activeTargetType === 'watched' ? 'cineVaultWatched' : 'cineVaultWatchlist';
            
            let list = JSON.parse(localStorage.getItem(storageKey)) || [];
            list = list.filter(m => m.id !== activeMovieObj.id);
            
            activeMovieObj.targetDate = dateVal;
            list.push(activeMovieObj);
            localStorage.setItem(storageKey, JSON.stringify(list));

            closeDateModal();
            renderLists();
            openDetails(activeMovieObj.id, activeMovieObj.media_type);
        }

        function toggleLike(btn) { btn.classList.toggle('active'); }

        function setupStarRating() {
            const stars = document.querySelectorAll('#starContainer span');
            stars.forEach((star, index) => {
                star.onclick = () => {
                    stars.forEach((s, i) => {
                        if (i <= index) s.classList.add('active');
                        else s.classList.remove('active');
                    });
                };
            });
        }

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
        }

        function renderLists() {
            const watchedContainer = document.getElementById('diaryContainer');
            const watchlistContainer = document.getElementById('watchlistContainer');

            let watched = JSON.parse(localStorage.getItem('cineVaultWatched')) || [];
            let watchlist = JSON.parse(localStorage.getItem('cineVaultWatchlist')) || [];

            watchedContainer.innerHTML = watched.length === 0 ? '<p style="font-size: 13px; color:var(--text-main);">No movies watched yet.</p>' : watched.map(m => `
                <div class="row-item" onclick="openDetails(${m.id}, '${m.media_type || 'movie'}')">
                    <img src="${m.poster_path ? IMAGE_BASE_URL + m.poster_path : ''}" alt="">
                    <div style="flex:1;">
                        <div style="color:#fff; font-weight:bold; font-size:14px;">${m.title || m.name}</div>
                        <div style="font-size:12px; color:var(--accent);">Watched on: ${m.targetDate || 'N/A'}</div>
                    </div>
                </div>
            `).join('');

            watchlistContainer.innerHTML = watchlist.length === 0 ? '<p style="font-size: 13px; color:var(--text-main);">No movies in watchlist.</p>' : watchlist.map(m => `
                <div class="row-item" onclick="openDetails(${m.id}, '${m.media_type || 'movie'}')">
                    <img src="${m.poster_path ? IMAGE_BASE_URL + m.poster_path : ''}" alt="">
                    <div style="flex:1;">
                        <div style="color:#fff; font-weight:bold; font-size:14px;">${m.title || m.name}</div>
                        <div style="font-size:12px; color:var(--accent);">Scheduled for: ${m.targetDate || 'N/A'}</div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVault - Modern TMDB Style</title>
    <style>
        :root {
            --bg-color: #032541;
            --card-bg: #1b222c;
            --accent: #01b4e4;
            --accent-green: #20c997;
            --text-main: #9ab;
            --text-white: #fff;
            --border-color: #2c3440;
            --danger: #ff8000;
        }

        /* --- MODERN CUSTOM SMOOTH SCROLLBAR --- */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #031d33;
        }
        ::-webkit-scrollbar-thumb {
            background: #1b4b70;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* Firefox scrollbar support */
        * {
            scrollbar-width: thin;
            scrollbar-color: #1b4b70 #031d33;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }
        .wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px 40px 15px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #031d33;
            padding: 15px 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        h1 {
            color: var(--text-white);
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        h1 span { 
            background: linear-gradient(to right, #90cea1, #01b4e4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .nav-link-item {
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
        }
        .nav-link-item:hover, .nav-link-item.active { 
            background: var(--accent); 
            color: #032541;
        }

        .action-toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .toolbar-btn {
            background: #01b4e4;
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s;
        }
        .toolbar-btn:hover { opacity: 0.9; }

        .search-container {
            margin-bottom: 25px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 20px;
            font-size: 15px;
            background: #fff;
            border: none;
            color: #333;
            border-radius: 30px;
            outline: none;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .trending-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .section-title {
            margin: 0;
            font-size: 20px;
            color: var(--text-white);
            font-weight: 700;
        }
        .toggle-pill {
            display: flex;
            background: #031d33;
            border: 1px solid var(--accent);
            border-radius: 20px;
            padding: 2px;
        }
        .pill-btn {
            background: transparent;
            border: none;
            color: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .pill-btn.active {
            background: #032541;
            color: var(--accent);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .card {
            background: transparent;
            border-radius: 8px;
            overflow: hidden;
            text-align: left;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card-img-wrapper {
            position: relative;
            width: 100%;
            height: 225px;
            border-radius: 8px;
            overflow: hidden;
            background: #041525;
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-rating {
            position: absolute;
            bottom: -12px;
            left: 10px;
            background: #081c22;
            border: 2px solid #21d07a;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card h4 {
            font-size: 14px;
            margin: 18px 4px 4px 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-white);
            font-weight: 700;
        }
        .card p {
            margin: 0 4px;
            font-size: 12px;
            color: var(--text-main);
        }

        .content-section {
            display: none;
        }
        .content-section.active-tab {
            display: block;
        }

        .row-item {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 10px;
            gap: 15px;
            cursor: pointer;
        }
        .row-item img {
            width: 45px;
            height: 65px;
            object-fit: cover;
            border-radius: 4px;
        }

        #fullPageView {
            display: none;
            background-color: var(--bg-color);
            min-height: calc(100vh - 80px);
        }
        .back-to-home-btn {
            background: #031d33;
            border: 1px solid var(--accent);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .back-to-home-btn:hover { background: var(--accent); color: #032541; }

        .tmdb-hero {
            position: relative;
            background-size: cover;
            background-position: center;
            padding: 50px 20px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        .tmdb-hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(3, 37, 65, 0.9);
        }
        .tmdb-hero-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        @media (min-width: 768px) {
            .tmdb-hero-content {
                flex-direction: row;
                align-items: center;
            }
        }
        .tmdb-poster {
            width: 240px;
            height: 360px;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            margin: 0 auto;
        }
        .tmdb-details h2 {
            margin: 0 0 10px 0;
            font-size: 32px;
            color: #fff;
        }
        .tmdb-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .user-score-box {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            color: #fff;
        }
        .score-circle {
            width: 50px;
            height: 50px;
            background: #081c22;
            border: 4px solid #21d07a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .tmdb-actions {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            align-items: center;
        }
        .circle-action-btn {
            width: 45px;
            height: 45px;
            background: #031d33;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            transition: background 0.2s;
        }
        .circle-action-btn:hover, .circle-action-btn.active { background: var(--accent); }
        .circle-action-btn svg { width: 20px; height: 20px; fill: currentColor; }

        /* Smooth Cast Row with Hidden Ugly Scrollbars */
        .cast-row {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 15px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .cast-row::-webkit-scrollbar {
            height: 5px; /* Slimmer scrollbar for cast list */
        }
        .cast-card {
            min-width: 130px;
            background: #fff;
            color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            text-align: left;
            padding-bottom: 10px;
            flex-shrink: 0;
        }
        .cast-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        .cast-card h5, .cast-card p {
            margin: 5px 8px;
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .cast-card h5 { font-weight: bold; }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(3, 37, 65, 0.85);
            overflow-y: auto;
        }
        .picker-modal-box, .date-modal-box {
            background: #0d253f;
            margin: 20% auto;
            padding: 25px;
            width: 90%;
            max-width: 360px;
            border-radius: 12px;
            text-align: center;
            color: #fff;
        }
        .picker-choice-btn {
            width: 100%;
            background: #01b4e4;
            border: none;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
        input[type="date"] {
            width: 100%;
            background: #032541;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            margin-top: 15px;
            box-sizing: border-box;
            color-scheme: dark;
        }
        .loader-trigger {
            height: 30px;
            text-align: center;
            color: var(--text-main);
            font-size: 13px;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-left">
            <h1 onclick="goHome()">TMDB <span>CineVault</span></h1>
            <div class="nav-links" id="mainNavLinks">
                <button id="navMoviesBtn" class="nav-link-item active" onclick="switchTab('movies', this)">Movies</button>
                <button class="nav-link-item" onclick="switchTab('tv', this)">TV Shows</button>
                <button class="nav-link-item" onclick="switchTab('diary', this)">Watched Diary</button>
                <button class="nav-link-item" onclick="switchTab('watchlist', this)">Watchlist</button>
            </div>
        </div>
        <div id="syncStatus" style="font-size: 13px; color: var(--accent-green);">🟢 Active</div>
    </header>

    <div class="wrapper">
        <div id="homeMainView">
            <div class="action-toolbar">
                <button class="toolbar-btn" onclick="openPickerChoiceModal()">
                    🎲 Random Picker
                </button>
            </div>

            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search for a movie, tv show, person..." oninput="searchMedia()">
            </div>
            <div id="searchResults" class="grid"></div>

            <div id="tab-movies" class="content-section active-tab">
                <div class="trending-header">
                    <h2 class="section-title">Trending Movies</h2>
                    <div class="toggle-pill">
                        <button class="pill-btn active" onclick="switchTrending('movie', 'day', this)">Today</button>
                        <button class="pill-btn" onclick="switchTrending('movie', 'week', this)">This Week</button>
                    </div>
                </div>
                <div id="moviesGrid" class="grid"></div>
                <div id="moviesLoader" class="loader-trigger">Loading more movies...</div>
            </div>

            <div id="tab-tv" class="content-section">
                <div class="trending-header">
                    <h2 class="section-title">Trending TV Shows</h2>
                    <div class="toggle-pill">
                        <button class="pill-btn active" onclick="switchTrending('tv', 'day', this)">Today</button>
                        <button class="pill-btn" onclick="switchTrending('tv', 'week', this)">This Week</button>
                    </div>
                </div>
                <div id="tvGrid" class="grid"></div>
                <div id="tvLoader" class="loader-trigger">Loading more TV shows...</div>
            </div>

            <div id="tab-diary" class="content-section">
                <h2 class="section-title" style="margin-bottom:15px;">📖 Watched Diary</h2>
                <div id="diaryContainer"><p style="font-size: 13px;">No media watched yet.</p></div>
            </div>

            <div id="tab-watchlist" class="content-section">
                <h2 class="section-title" style="margin-bottom:15px;">🗓️ Watchlist / Schedule</h2>
                <div id="watchlistContainer"><p style="font-size: 13px;">No media in watchlist.</p></div>
            </div>
        </div>

        <div id="fullPageView">
            <button class="back-to-home-btn" onclick="goHome()">&#8592; Back</button>
            <div id="fullPageBody"></div>
        </div>
    </div>

    <div id="pickerChoiceModal" class="modal">
        <div class="picker-modal-box">
            <h3 style="margin-top:0; font-size:16px;">Random Picker</h3>
            <p style="font-size:13px; color:var(--text-main);">Kisme se random pick karna hai?</p>
            <button class="picker-choice-btn" onclick="pickRandomMedia('movie')">🎬 Movie</button>
            <button class="picker-choice-btn" onclick="pickRandomMedia('tv')">📺 TV Show</button>
            <button onclick="closePickerChoiceModal()" style="margin-top:15px; width:100%; background:transparent; border:1px solid var(--border-color); padding:10px; border-radius:8px; color:var(--text-main); cursor:pointer;">Cancel</button>
        </div>
    </div>

    <div id="dateModal" class="modal">
        <div class="date-modal-box">
            <h3 id="dateModalTitle" style="margin-top:0; font-size:16px;">Select Date</h3>
            <p id="dateModalMovieName" style="color:var(--accent); font-size:14px; font-weight:bold;"></p>
            <input type="date" id="selectedDateInput">
            <button onclick="confirmDateSelection()" style="margin-top:20px; width:100%; background:var(--accent); border:none; padding:12px; border-radius:8px; font-weight:bold; color:#fff; cursor:pointer;">Confirm & Save</button>
            <button onclick="closeDateModal()" style="margin-top:8px; width:100%; background:transparent; border:1px solid var(--border-color); padding:10px; border-radius:8px; color:var(--text-main); cursor:pointer;">Cancel</button>
        </div>
    </div>

    <script>
        const TMDB_API_KEY = '9c95420163879f1c4726c540b305cbc6';
        const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';
        const BACKDROP_BASE_URL = 'https://image.tmdb.org/t/p/original';

        let activeMovieObj = null;
        let activeTargetType = '';
        
        let moviePage = 1;
        let tvPage = 1;
        let currentTab = 'movies';
        let movieTrendingWindow = 'day';
        let tvTrendingWindow = 'day';
        let isLoading = false;

        initApp();

        function initApp() {
            loadTrendingData('movie', movieTrendingWindow, 1, true);
            loadTrendingData('tv', tvTrendingWindow, 1, true);
            renderLists();
            setupInfiniteScroll();
        }

        function switchTab(tabName, btn) {
            document.querySelectorAll('.nav-link-item').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active-tab'));
            
            if(btn) btn.classList.add('active');
            currentTab = tabName;
            document.getElementById('tab-' + tabName).classList.add('active-tab');
        }

        function goHome() {
            document.getElementById('fullPageView').style.display = 'none';
            document.getElementById('homeMainView').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function switchTrending(type, windowType, pillBtnElement) {
            if (isLoading) return;
            if (type === 'movie') {
                movieTrendingWindow = windowType;
                moviePage = 1;
                document.querySelectorAll('#tab-movies .pill-btn').forEach(b => b.classList.remove('active'));
                pillBtnElement.classList.add('active');
                loadTrendingData('movie', windowType, 1, true);
            } else {
                tvTrendingWindow = windowType;
                tvPage = 1;
                document.querySelectorAll('#tab-tv .pill-btn').forEach(b => b.classList.remove('active'));
                pillBtnElement.classList.add('active');
                loadTrendingData('tv', windowType, 1, true);
            }
        }

        async function loadTrendingData(type, windowType, pageNum, reset = false) {
            if (isLoading) return;
            isLoading = true;
            try {
                const res = await fetch(`https://api.themoviedb.org/3/trending/${type}/${windowType}?api_key=${TMDB_API_KEY}&page=${pageNum}`);
                if (!res.ok) throw new Error('Network response was not ok');
                const data = await res.json();
                
                if(data.results) {
                    appendMediaCards(data.results, type === 'movie' ? 'moviesGrid' : 'tvGrid', type, reset);
                }
            } catch (err) { 
                console.error("Error loading trending media:", err); 
            } finally {
                isLoading = false;
            }
        }

        function appendMediaCards(items, elementId, mediaType, reset = false) {
            const container = document.getElementById(elementId);
            if (reset) container.innerHTML = '';

            items.forEach(item => {
                if (!item.poster_path) return;
                const title = item.title || item.name;
                const date = item.release_date || item.first_air_date || '';
                const ratingNum = item.vote_average ? Math.round(item.vote_average * 10) : 0;
                item.vote_average = item.vote_average || 0;

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openDetails(item.id, mediaType);
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${IMAGE_BASE_URL + item.poster_path}" alt="${title}" loading="lazy">
                        <div class="card-rating">${ratingNum ? ratingNum + '%' : 'NR'}</div>
                    </div>
                    <h4>${title}</h4>
                    <p>${date}</p>
                `;
                container.appendChild(card);
            });
        }

        function setupInfiniteScroll() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && !isLoading) {
                        if (currentTab === 'movies') {
                            moviePage++;
                            loadTrendingData('movie', movieTrendingWindow, moviePage, false);
                        } else if (currentTab === 'tv') {
                            tvPage++;
                            loadTrendingData('tv', tvTrendingWindow, tvPage, false);
                        }
                    }
                });
            }, { threshold: 0.1 });

            const mLoader = document.getElementById('moviesLoader');
            const tLoader = document.getElementById('tvLoader');
            if (mLoader) observer.observe(mLoader);
            if (tLoader) observer.observe(tLoader);
        }

        function openPickerChoiceModal() {
            document.getElementById('pickerChoiceModal').style.display = 'block';
        }

        function closePickerChoiceModal() {
            document.getElementById('pickerChoiceModal').style.display = 'none';
        }

        async function pickRandomMedia(type) {
            closePickerChoiceModal();
            const randomPage = Math.floor(Math.random() * 5) + 1;
            try {
                const res = await fetch(`https://api.themoviedb.org/3/trending/${type}/day?api_key=${TMDB_API_KEY}&page=${randomPage}`);
                const data = await res.json();
                const items = data.results ? data.results.filter(m => m.poster_path) : [];
                if (items.length > 0) {
                    const chosen = items[Math.floor(Math.random() * items.length)];
                    if (chosen.vote_average === undefined) chosen.vote_average = 0;
                    openDetails(chosen.id, type);
                } else {
                    alert("Could not pick a random item. Try again.");
                }
            } catch (err) { 
                console.error("Error picking random item:", err); 
                alert("Network error while picking random item.");
            }
        }

        async function searchMedia() {
            const query = document.getElementById('searchInput').value;
            const resultsDiv = document.getElementById('searchResults');
            if (!query.trim()) { resultsDiv.innerHTML = ''; return; }

            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`);
                const data = await res.json();
                
                resultsDiv.innerHTML = '';
                if(data.results) {
                    data.results.forEach(item => {
                        if (!item.poster_path || item.media_type === 'person') return;
                        const title = item.title || item.name;
                        const date = item.release_date || item.first_air_date || '';
                        const ratingNum = item.vote_average ? Math.round(item.vote_average * 10) : 0;
                        item.vote_average = item.vote_average || 0;

                        const card = document.createElement('div');
                        card.className = 'card';
                        card.onclick = () => openDetails(item.id, item.media_type);
                        card.innerHTML = `
                            <div class="card-img-wrapper">
                                <img src="${IMAGE_BASE_URL + item.poster_path}" alt="${title}" loading="lazy">
                                <div class="card-rating">${ratingNum ? ratingNum + '%' : 'NR'}</div>
                            </div>
                            <h4>${title}</h4>
                            <p>${date}</p>
                        `;
                        resultsDiv.appendChild(card);
                    });
                }
            } catch (err) { console.error("Error searching media:", err); }
        }

        async function openDetails(id, type) {
            document.getElementById('homeMainView').style.display = 'none';
            const fullPageView = document.getElementById('fullPageView');
            const fullPageBody = document.getElementById('fullPageBody');
            
            fullPageView.style.display = 'block';
            fullPageBody.innerHTML = '<p style="text-align:center; padding:60px; color:var(--accent);">Loading details...</p>';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            try {
                if (type !== 'movie' && type !== 'tv') {
                    type = 'movie';
                }

                const [detailRes, creditRes] = await Promise.all([
                    fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${TMDB_API_KEY}`),
                    fetch(`https://api.themoviedb.org/3/${type}/${id}/credits?api_key=${TMDB_API_KEY}`)
                ]);
                
                if (!detailRes.ok) throw new Error(`HTTP error! status: ${detailRes.status}`);

                const details = await detailRes.json();
                const credits = await creditRes.ok ? await creditRes.json() : { crew: [], cast: [] };

                details.media_type = type;
                activeMovieObj = details;

                const title = details.title || details.name;
                const year = (details.release_date || details.first_air_date || '').split('-')[0];
                const backdrop = details.backdrop_path ? BACKDROP_BASE_URL + details.backdrop_path : '';
                const poster = details.poster_path ? IMAGE_BASE_URL + details.poster_path : '';
                const cast = credits.cast ? credits.cast.slice(0, 10) : [];
                const ratingPercent = details.vote_average ? Math.round(details.vote_average * 10) : 0;

                let watchedList = JSON.parse(localStorage.getItem('cineVaultWatched')) || [];
                let watchlist = JSON.parse(localStorage.getItem('cineVaultWatchlist')) || [];
                let isWatched = watchedList.some(m => m.id === id);
                let isInWatchlist = watchlist.some(m => m.id === id);

                fullPageBody.innerHTML = `
                    <div class="tmdb-hero" style="background-image: url('${backdrop}')">
                        <div class="tmdb-hero-content">
                            <img src="${poster}" class="tmdb-poster" alt="${title}">
                            <div class="tmdb-details">
                                <h2>${title} (${year})</h2>
                                <div class="tmdb-meta">
                                    <div class="user-score-box">
                                        <div class="score-circle">${ratingPercent}%</div>
                                        User Score
                                    </div>
                                </div>
                                
                                <div class="tmdb-actions">
                                    <button class="circle-action-btn ${isWatched ? 'active' : ''}" onclick="triggerDateModal('watched')" title="Mark as Watched">
                                        <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                                    </button>
                                    <button class="circle-action-btn ${isInWatchlist ? 'active' : ''}" onclick="triggerDateModal('watchlist')" title="Add to Watchlist">
                                        <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15l-5-2.18L7 18V5h10v13z"/></svg>
                                    </button>
                                </div>

                                <h3 style="font-size:16px; margin:15px 0 5px 0; color:#fff;">Overview</h3>
                                <p style="font-size:14px; line-height:1.6; color: #dbdbdb; margin:0;">${details.overview || 'No description available.'}</p>
                            </div>
                        </div>
                    </div>

                    <div style="margin-top:30px;">
                        <h3 style="font-size:20px; margin-top:0; color:#fff; margin-bottom:15px;">Top Billed Cast</h3>
                        <div class="cast-row">
                            ${cast.map(actor => `
                                <div class="cast-card">
                                    <img src="${actor.profile_path ? IMAGE_BASE_URL + actor.profile_path : 'https://via.placeholder.com/130x150?text=No+Image'}" alt="${actor.name}">
                                    <h5>${actor.name}</h5>
                                    <p>${actor.character || ''}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error("Failed to load details:", err);
                fullPageBody.innerHTML = `<p style="text-align:center; color:orange; padding:40px;">Failed to load details. (${err.message})</p>`;
            }
        }

        function triggerDateModal(type) {
            activeTargetType = type;
            const title = activeMovieObj.title || activeMovieObj.name;
            document.getElementById('dateModalTitle').innerText = type === 'watched' ? 'Mark as Watched' : 'Add to Watchlist';
            document.getElementById('dateModalMovieName').innerText = title;
            document.getElementById('selectedDateInput').value = new Date().toISOString().split('T')[0];
            document.getElementById('dateModal').style.display = 'block';
        }

        function closeDateModal() {
            document.getElementById('dateModal').style.display = 'none';
        }

        function confirmDateSelection() {
            const dateVal = document.getElementById('selectedDateInput').value;
            const storageKey = activeTargetType === 'watched' ? 'cineVaultWatched' : 'cineVaultWatchlist';
            
            let list = JSON.parse(localStorage.getItem(storageKey)) || [];
            list = list.filter(m => m.id !== activeMovieObj.id);
            
            activeMovieObj.targetDate = dateVal;
            list.push(activeMovieObj);
            localStorage.setItem(storageKey, JSON.stringify(list));

            closeDateModal();
            renderLists();
            openDetails(activeMovieObj.id, activeMovieObj.media_type);
        }

        function renderLists() {
            const watchedContainer = document.getElementById('diaryContainer');
            const watchlistContainer = document.getElementById('watchlistContainer');

            let watched = JSON.parse(localStorage.getItem('cineVaultWatched')) || [];
            let watchlist = JSON.parse(localStorage.getItem('cineVaultWatchlist')) || [];

            watchedContainer.innerHTML = watched.length === 0 ? '<p style="font-size: 13px; color:var(--text-main);">No media watched yet.</p>' : watched.map(m => `
                <div class="row-item" onclick="openDetails(${m.id}, '${m.media_type || 'movie'}')">
                    <img src="${m.poster_path ? IMAGE_BASE_URL + m.poster_path : ''}" alt="">
                    <div style="flex:1;">
                        <div style="color:#fff; font-weight:bold; font-size:14px;">${m.title || m.name}</div>
                        <div style="font-size:12px; color:var(--accent);">Watched on: ${m.targetDate || 'N/A'}</div>
                    </div>
                </div>
            `).join('');

            watchlistContainer.innerHTML = watchlist.length === 0 ? '<p style="font-size: 13px; color:var(--text-main);">No media in watchlist.</p>' : watchlist.map(m => `
                <div class="row-item" onclick="openDetails(${m.id}, '${m.media_type || 'movie'}')">
                    <img src="${m.poster_path ? IMAGE_BASE_URL + m.poster_path : ''}" alt="">
                    <div style="flex:1;">
                        <div style="color:#fff; font-weight:bold; font-size:14px;">${m.title || m.name}</div>
                        <div style="font-size:12px; color:var(--accent);">Scheduled for: ${m.targetDate || 'N/A'}</div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>

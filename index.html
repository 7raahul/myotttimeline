<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEVO - Mobile & Web UI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-950 text-white font-sans m-0 p-0">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [mobileView, setMobileView] = useState('home');
            const [selectedItem, setSelectedItem] = useState(null);
            
            // Home Infinite Scroll States
            const [homeItems, setHomeItems] = useState([]);
            const [page, setPage] = useState(1);
            const [loading, setLoading] = useState(false);
            const loadedIds = useRef(new Set());

            // Hero Slider States
            const [trendingList, setTrendingList] = useState([]);
            const [heroIndex, setHeroIndex] = useState(0);

            // Search & Filter States
            const [searchQuery, setSearchQuery] = useState('');
            const [searchBy, setSearchBy] = useState('ALL');
            const [selectedGenre, setSelectedGenre] = useState('');
            const [selectedYear, setSelectedYear] = useState('');
            const [selectedCountry, setSelectedCountry] = useState('');

            // Fetch Home Content with Duplicate Check
            const fetchHomeContent = async (pageNum) => {
                setLoading(true);
                setTimeout(() => {
                    const generatedItems = Array.from({ length: 10 }, (_, index) => {
                        const id = (pageNum - 1) * 10 + index + 400;
                        return {
                            id: id,
                            title: `Cinevo Title ${id}`,
                            release_date: '2026-06-01',
                            rating: '8.6',
                            backdrop_path: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=800&q=80'
                        };
                    });

                    const uniqueItems = generatedItems.filter(item => {
                        if (!loadedIds.current.has(item.id)) {
                            loadedIds.current.add(item.id);
                            return true;
                        }
                        return false;
                    });

                    setHomeItems(prev => [...prev, ...uniqueItems]);
                    setLoading(false);
                }, 600);
            };

            useEffect(() => {
                fetchHomeContent(page);
                setTrendingList([
                    { id: 101, title: 'Epic Landscape Film 2026', release_date: '2026-05-10', rating: '9.2', backdrop_path: 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=800&q=80' },
                    { id: 102, title: 'Cyber Universe Action', release_date: '2026-03-22', rating: '8.4', backdrop_path: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80' }
                ]);
            }, [page]);

            // Auto slide hero cards
            useEffect(() => {
                if (trendingList.length === 0) return;
                const timer = setInterval(() => {
                    setHeroIndex(prev => (prev + 1) % trendingList.length);
                }, 3500);
                return () => clearInterval(timer);
            }, [trendingList.length]);

            const handleScroll = (e) => {
                const { scrollTop, clientHeight, scrollHeight } = e.currentTarget;
                if (scrollHeight - scrollTop <= clientHeight + 40 && !loading) {
                    setPage(prev => prev + 1);
                }
            };

            const handleRefresh = () => {
                loadedIds.current.clear();
                setHomeItems([]);
                setPage(1);
                fetchHomeContent(1);
            };

            const currentYear = new Date().getFullYear();
            const yearsList = Array.from({ length: currentYear - 1901 + 1 }, (_, i) => currentYear - i);

            return (
                <div>
                    {/* ================= DESKTOP / WEB UI (Untouched) ================= */}
                    <div className="hidden md:block bg-gray-950 min-h-screen text-white">
                        <header className="flex justify-between items-center px-8 py-4 bg-black border-b border-gray-800">
                            <div className="text-2xl font-bold text-yellow-400 tracking-wider cursor-pointer">CINEVO</div>
                            <nav className="flex space-x-6 text-sm font-medium text-gray-300">
                                <span className="hover:text-yellow-400 cursor-pointer">Home</span>
                                <span className="hover:text-yellow-400 cursor-pointer">Movies</span>
                                <span className="hover:text-yellow-400 cursor-pointer">TV Shows</span>
                                <span className="hover:text-yellow-400 cursor-pointer">My List</span>
                            </nav>
                            <div className="flex items-center space-x-4">
                                <input type="text" placeholder="Search movies, shows..." className="bg-gray-900 border border-gray-700 px-3 py-1.5 rounded-lg text-sm text-white focus:outline-none focus:border-yellow-400" />
                                <button className="bg-yellow-400 text-black px-4 py-1.5 rounded-lg font-bold text-sm">Login</button>
                            </div>
                        </header>
                        <main className="p-8">
                            <h1 className="text-2xl font-bold mb-4">Desktop / Browser Version (Untouched)</h1>
                            <div className="grid grid-cols-4 gap-6">
                                {[1, 2, 3, 4, 5, 6, 7, 8].map(item => (
                                    <div key={item} className="bg-gray-900 rounded-xl overflow-hidden border border-gray-800">
                                        <div className="h-40 bg-gray-800 flex items-center justify-center text-gray-500">Desktop Poster {item}</div>
                                        <div className="p-3">
                                            <h3 className="font-semibold text-sm">Movie Title {item}</h3>
                                            <p className="text-xs text-gray-400 mt-1">2026 • ★ 8.8 IMDb</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </main>
                    </div>

                    {/* ================= MOBILE UI ================= */}
                    <div className="md:hidden flex justify-center items-center bg-gray-950 min-h-screen">
                        <div className="w-full max-w-md h-screen bg-black flex flex-col relative overflow-hidden shadow-2xl">
                            
                            {/* Mobile Top Bar */}
                            <div className="flex justify-between items-center px-4 py-3 bg-black/90 backdrop-blur border-b border-gray-800 z-30 sticky top-0">
                                <button onClick={() => setMobileView('home')} className="text-lg font-bold tracking-wider text-yellow-400 focus:outline-none">
                                    CINEVO
                                </button>
                                <button onClick={() => setMobileView('account')} className="w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center text-xs border border-gray-700 focus:outline-none">
                                    👤
                                </button>
                            </div>

                            {/* Scrollable View Area */}
                            <div className="flex-1 overflow-y-auto relative pb-20" onScroll={mobileView === 'home' ? handleScroll : undefined}>
                                
                                {mobileView === 'home' && (
                                    <div>
                                        <div className="text-center py-1 text-[10px] text-gray-500 bg-gray-900/50 cursor-pointer" onClick={handleRefresh}>
                                            🔄 Pull / Click to Refresh Fresh Content
                                        </div>

                                        {/* Hero Section */}
                                        {trendingList.length > 0 && (
                                            <div className="relative w-full h-52 bg-gray-900 overflow-hidden mb-3">
                                                <img src={trendingList[heroIndex].backdrop_path} alt="" className="w-full h-full object-cover" />
                                                <div className="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>

                                                <div className="absolute top-2 right-2 flex space-x-1 z-20 bg-black/60 p-1 rounded backdrop-blur border border-gray-800">
                                                    <button onClick={() => setHeroIndex(prev => (prev === 0 ? trendingList.length - 1 : prev - 1))} className="px-2 py-0.5 bg-gray-800 text-[10px] rounded text-white">&lt;</button>
                                                    <button onClick={() => setHeroIndex(prev => (prev + 1) % trendingList.length)} className="px-2 py-0.5 bg-gray-800 text-[10px] rounded text-white">&gt;</button>
                                                </div>

                                                <div className="absolute bottom-3 left-3 right-10">
                                                    <h2 className="text-sm font-bold truncate text-white">{trendingList[heroIndex].title}</h2>
                                                    <div className="flex items-center space-x-2 text-[10px] text-gray-300 mt-0.5">
                                                        <span>{trendingList[heroIndex].release_date}</span>
                                                        <span className="text-yellow-400 font-bold">★ {trendingList[heroIndex].rating} IMDb</span>
                                                    </div>
                                                </div>

                                                <div className="absolute bottom-3 right-3 flex space-x-1 z-10">
                                                    {trendingList.map((_, idx) => (
                                                        <span key={idx} className={`h-1.5 rounded-full transition-all ${idx === heroIndex ? 'w-3 bg-yellow-400' : 'w-1.5 bg-gray-500'}`} />
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {/* Infinite Scroll Grid */}
                                        <div className="px-3">
                                            <h3 className="text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider">Discover Content</h3>
                                            <div className="grid grid-cols-2 gap-2">
                                                {homeItems.map(item => (
                                                    <div key={item.id} onClick={() => { setSelectedItem(item); setMobileView('details'); }} className="bg-gray-900 rounded-xl overflow-hidden border border-gray-800 cursor-pointer">
                                                        <img src={item.backdrop_path} alt="" className="w-full h-24 object-cover" />
                                                        <div className="p-2">
                                                            <h4 className="text-[11px] font-medium text-white truncate">{item.title}</h4>
                                                            <div className="flex justify-between items-center mt-1 text-[9px] text-gray-400">
                                                                <span>{item.release_date.split('-')[0]}</span>
                                                                <span className="text-yellow-400 font-bold">★ {item.rating}</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                            {loading && <div className="text-center py-3 text-[10px] text-gray-400">Loading more items...</div>}
                                        </div>
                                    </div>
                                )}

                                {mobileView === 'search' && (
                                    <div className="p-3">
                                        <h2 className="text-base font-bold mb-2 text-white">Search & Filters</h2>
                                        <input type="text" placeholder="Search movies, TV shows..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-yellow-400 mb-2" />
                                        <div className="flex space-x-1.5 mb-2">
                                            {['ALL', 'MOVIES', 'TV SHOWS'].map(type => (
                                                <button key={type} onClick={() => setSearchBy(type)} className={`flex-1 py-1 text-[10px] font-semibold rounded-lg border ${searchBy === type ? 'bg-yellow-400 text-black border-yellow-400' : 'bg-gray-900 text-gray-300 border-gray-700'}`}>{type}</button>
                                            ))}
                                        </div>
                                        <div className="grid grid-cols-3 gap-1.5 mb-3">
                                            <select value={selectedGenre} onChange={(e) => setSelectedGenre(e.target.value)} className="bg-gray-900 border border-gray-700 text-[10px] text-gray-300 rounded-lg p-1.5">
                                                <option value="">Genre</option>
                                                <option value="action">Action</option>
                                                <option value="drama">Drama</option>
                                            </select>
                                            <select value={selectedYear} onChange={(e) => setSelectedYear(e.target.value)} className="bg-gray-900 border border-gray-700 text-[10px] text-gray-300 rounded-lg p-1.5">
                                                <option value="">Year</option>
                                                {yearsList.map(y => <option key={y} value={y}>{y}</option>)}
                                            </select>
                                            <select value={selectedCountry} onChange={(e) => setSelectedCountry(e.target.value)} className="bg-gray-900 border border-gray-700 text-[10px] text-gray-300 rounded-lg p-1.5">
                                                <option value="">Country</option>
                                                <option value="us">USA</option>
                                                <option value="in">India</option>
                                            </select>
                                        </div>
                                    </div>
                                )}

                                {mobileView === 'pickForMe' && (
                                    <div className="p-4 flex flex-col items-center justify-center h-full text-center">
                                        <span className="text-3xl mb-2">🎲</span>
                                        <h2 className="text-base font-bold text-white">Pick For Me</h2>
                                        <button className="mt-4 px-5 py-2 bg-yellow-400 text-black font-semibold text-xs rounded-xl">Surprise Me</button>
                                    </div>
                                )}

                                {mobileView === 'timeline' && (
                                    <div className="p-3">
                                        <h2 className="text-base font-bold mb-3 text-white">Watch Timeline</h2>
                                        <div className="space-y-2 border-l-2 border-yellow-400 pl-3 ml-1 text-xs">
                                            <p className="text-yellow-400 font-semibold">Today</p>
                                            <p className="text-gray-300">Checked out recent trending trailers.</p>
                                        </div>
                                    </div>
                                )}

                                {mobileView === 'details' && selectedItem && (
                                    <div className="p-3">
                                        <button onClick={() => setMobileView('home')} className="mb-2 text-[10px] bg-gray-900 text-yellow-400 px-2.5 py-1 rounded-lg border border-gray-700">← Back</button>
                                        <img src={selectedItem.backdrop_path} alt="" className="w-full h-40 object-cover rounded-xl mb-2" />
                                        <h2 className="text-base font-bold text-white">{selectedItem.title}</h2>
                                        <p className="text-[10px] text-yellow-400 font-bold mt-1">★ {selectedItem.rating} IMDb</p>
                                    </div>
                                )}

                                {mobileView === 'account' && (
                                    <div className="p-4 flex flex-col items-center justify-center h-full text-center">
                                        <div className="w-14 h-14 bg-gray-900 rounded-full flex items-center justify-center text-xl mb-2 border border-gray-700">👤</div>
                                        <h2 className="text-base font-bold mb-1 text-white">CINEVO Account</h2>
                                        <div className="w-full space-y-2 mt-4">
                                            <button className="w-full py-2 bg-yellow-400 text-black text-xs font-bold rounded-xl">Login</button>
                                            <button className="w-full py-2 bg-gray-900 border border-gray-700 text-white text-xs font-bold rounded-xl">Sign Up</button>
                                        </div>
                                    </div>
                                )}

                            </div>

                            {/* Back to top arrow */}
                            <button onClick={() => {
                                const container = document.querySelector('.overflow-y-auto');
                                if (container) container.scrollTo({ top: 0, behavior: 'smooth' });
                            }} className="absolute bottom-16 right-3 w-8 h-8 bg-yellow-400 text-black font-bold rounded-full shadow-lg flex items-center justify-center z-40 text-xs focus:outline-none">
                                ↑
                            </button>

                            {/* Fixed Bottom Navigation */}
                            <div className="absolute bottom-0 left-0 right-0 h-14 bg-black/95 border-t border-gray-800 flex justify-around items-center z-30 px-1">
                                {[
                                    { id: 'home', label: 'Home', icon: '🏠' },
                                    { id: 'search', label: 'Search', icon: '🔍' },
                                    { id: 'pickForMe', label: 'Pick for Me', icon: '🎲' },
                                    { id: 'timeline', label: 'Watch Timeline', icon: '◇' }
                                ].map(item => (
                                    <button key={item.id} onClick={() => setMobileView(item.id)} className={`flex flex-col items-center justify-center w-full h-full text-[10px] focus:outline-none ${mobileView === item.id ? 'text-yellow-400 font-semibold' : 'text-gray-400'}`}>
                                        <span className="text-base mb-0.5">{item.icon}</span>
                                        <span>{item.label}</span>
                                    </button>
                                ))}
                            </div>

                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>

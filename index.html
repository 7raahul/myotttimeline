<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Movie & Series Diary</title>
  <style>
    /* Global Styles */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #14181c;
      color: #9ab;
      padding-bottom: 50px;
    }

    /* Top Navigation Header */
    header {
      background-color: #1b2228;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 5%;
      border-bottom: 1px solid #2c3440;
    }
    .logo { color: #00e054; font-size: 22px; font-weight: bold; }
    
    .search-container { position: relative; }
    .search-box input {
      background: #2c3440;
      border: 1px solid #456;
      padding: 10px 18px;
      border-radius: 20px;
      color: #fff;
      outline: none;
      width: 280px;
    }

    /* Search Live Dropdown */
    .search-results {
      position: absolute;
      top: 45px;
      right: 0;
      width: 320px;
      background: #1e252b;
      border: 1px solid #2c3440;
      border-radius: 8px;
      max-height: 380px;
      overflow-y: auto;
      z-index: 100;
      display: none;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.5);
    }
    .search-item {
      display: flex;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #2c3440;
      cursor: pointer;
    }
    .search-item:hover { background: #2c3440; }
    .search-item img { width: 45px; height: 65px; object-fit: cover; border-radius: 4px; margin-right: 12px; }
    .search-item-info { color: #fff; font-size: 13px; }
    .search-item-info span { color: #678; font-size: 11px; display: block; }

    /* Main Display Layout */
    .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
    h2 { color: #fff; margin-bottom: 20px; border-left: 4px solid #00e054; padding-left: 10px; }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }
    .movie-card {
      background: #1e252b;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #2c3440;
      transition: transform 0.2s ease;
    }
    .movie-card:hover { transform: translateY(-5px); border-color: #00e054; }
    .movie-poster { width: 100%; height: 260px; object-fit: cover; }
    .movie-details { padding: 12px; }
    .movie-title { color: #fff; font-size: 15px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .watch-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 12px;
    }
    .watch-date { color: #678; font-size: 11px; }
    .stars { color: #00e054; letter-spacing: 1px; }

    /* Modal Pop-up Box */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1e252b;
      padding: 25px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      border: 1px solid #00e054;
      color: #fff;
    }
    .modal-content h3 { margin-bottom: 15px; color: #00e054; }
    .modal-content label { display: block; margin: 10px 0 5px; font-size: 12px; color: #9ab; }
    .modal-content input, .modal-content select {
      width: 100%; padding: 8px; background: #2c3440; border: none; color: #fff; border-radius: 5px;
    }
    .modal-buttons { margin-top: 20px; display: flex; justify-content: space-between; }
    .btn { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-save { background: #00e054; color: #000; }
    .btn-close { background: #e50914; color: #fff; }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="logo">🎬 My Movie Diary</div>
    <div class="search-container">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search Movie or TV Show..." oninput="searchMedia()">
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </header>

  <!-- Main Display Container -->
  <div class="container">
    <h2>Recently Watched</h2>
    <div class="movie-grid" id="movieGrid">
      <p style="color: #678;">Loading watched entries...</p>
    </div>
  </div>

  <!-- Rating/Date Entry Pop-up Window -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <h3 id="modalTitle">Log Movie</h3>
      <label>Watch Date:</label>
      <input type="date" id="watchDate">
      
      <label>Your Rating:</label>
      <select id="userRating">
        <option value="★★★★★ (5/5)">★★★★★ (5/5)</option>
        <option value="★★★★½ (4.5/5)">★★★★½ (4.5/5)</option>
        <option value="★★★★☆ (4/5)">★★★★☆ (4/5)</option>
        <option value="★★★☆☆ (3/5)">★★★☆☆ (3/5)</option>
        <option value="★★☆☆☆ (2/5)">★★☆☆☆ (2/5)</option>
        <option value="★☆☆☆☆ (1/5)">★☆☆☆☆ (1/5)</option>
      </select>

      <div class="modal-buttons">
        <button class="btn btn-close" onclick="closeModal()">Cancel</button>
        <button class="btn btn-save" onclick="generateJsonSnippet()">Get JSON Code</button>
      </div>
    </div>
  </div>

  <script>
    // Aapka exact GitHub Raw URL
    const GITHUB_JSON_URL = 'https://raw.githubusercontent.com/7raahul/myotttimeline/refs/heads/main/data.json';

    let selectedMovieData = {};

    // 1. Fetch & Render Saved Movies From GitHub JSON
    async function loadDiary() {
      try {
        const response = await fetch(GITHUB_JSON_URL);
        if (!response.ok) throw new Error("JSON File Not Found");
        const movies = await response.json();
        
        const grid = document.getElementById('movieGrid');
        grid.innerHTML = '';

        movies.forEach(item => {
          grid.innerHTML += `
            <div class="movie-card">
              <img class="movie-poster" src="${item.poster}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/500x750?text=No+Poster'">
              <div class="movie-details">
                <div class="movie-title">${item.title}</div>
                <div class="watch-meta">
                  <span class="watch-date">📅 ${item.date}</span>
                  <span class="stars">${item.rating}</span>
                </div>
              </div>
            </div>
          `;
        });
      } catch (err) {
        document.getElementById('movieGrid').innerHTML = `
          <p style="color: #678;">Search any title from top right to log your entries.</p>
        `;
      }
    }

    // 2. Stable Search API (No CORS Issues)
    async function searchMedia() {
      const query = document.getElementById('searchInput').value.trim();
      const resultsDiv = document.getElementById('searchResults');

      if (query.length < 2) {
        resultsDiv.style.display = 'none';
        return;
      }

      try {
        const res = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(query)}`);
        if (!res.ok) throw new Error('API Request Failed');

        const data = await res.json();

        resultsDiv.innerHTML = '';
        resultsDiv.style.display = 'block';

        if (!data || data.length === 0) {
          resultsDiv.innerHTML = '<div style="padding:10px; color:#678;">No results found</div>';
          return;
        }

        data.slice(0, 5).forEach(item => {
          const show = item.show;
          const poster = show.image ? show.image.medium : 'https://via.placeholder.com/150x225?text=No+Poster';
          const title = show.name;
          const year = show.premiered ? show.premiered.split('-')[0] : 'N/A';

          const div = document.createElement('div');
          div.className = 'search-item';
          div.innerHTML = `
            <img src="${poster}" alt="${title}">
            <div class="search-item-info">
              <b>${title}</b>
              <span>Released: ${year}</span>
            </div>
          `;
          div.onclick = () => openAddModal(title, year, poster);
          resultsDiv.appendChild(div);
        });
      } catch (err) {
        console.error("Search error:", err);
      }
    }

    // 3. Modal Control System
    function openAddModal(title, year, poster) {
      selectedMovieData = { title: `${title} (${year})`, poster: poster };
      document.getElementById('modalTitle').innerText = `Log: ${title}`;
      document.getElementById('searchResults').style.display = 'none';
      document.getElementById('addModal').style.display = 'flex';
      
      document.getElementById('watchDate').valueAsDate = new Date();
    }

    function closeModal() {
      document.getElementById('addModal').style.display = 'none';
    }

    // 4. Copy Code Snippet Generator
    function generateJsonSnippet() {
      const dateVal = document.getElementById('watchDate').value;
      const ratingVal = document.getElementById('userRating').value;

      const newEntry = {
        title: selectedMovieData.title,
        poster: selectedMovieData.poster,
        date: dateVal,
        rating: ratingVal
      };

      const jsonString = JSON.stringify(newEntry, null, 2);
      prompt("Copy this block and paste inside your GitHub data.json file array:", jsonString);
      closeModal();
    }

    loadDiary();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie & TV Tracker</title>

<style>
:root{
  --bg:#090b10;
  --panel:#11141b;
  --panel2:#171b24;
  --card:#141820;
  --border:#252b36;
  --text:#f4f6f8;
  --muted:#9299a6;
  --accent:#e5e7eb;
  --danger:#ef4444;
  --success:#22c55e;
  --gold:#f5c518;
  --shadow:0 14px 40px rgba(0,0,0,.35);
  --radius:18px;
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 20% 0%,rgba(255,255,255,.035),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,
select,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
}

.hidden{
  display:none!important;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(9,11,16,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.nav{
  max-width:1450px;
  margin:auto;
  min-height:70px;
  padding:12px 22px;
  display:flex;
  align-items:center;
  gap:18px;
}

.logo{
  font-size:21px;
  font-weight:800;
  letter-spacing:-.5px;
  white-space:nowrap;
}

.logo span{
  color:#9ca3af;
}

.search-wrap{
  flex:1;
  max-width:580px;
  position:relative;
}

.search{
  width:100%;
  background:#151922;
  border:1px solid var(--border);
  border-radius:12px;
  color:white;
  outline:none;
  padding:12px 15px 12px 42px;
}

.search:focus{
  border-color:#4b5563;
}

.search-icon{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
}

.nav-actions{
  margin-left:auto;
  display:flex;
  gap:8px;
}

.nav-btn{
  border:1px solid var(--border);
  background:#131720;
  color:#d9dde4;
  padding:9px 13px;
  border-radius:10px;
}

.nav-btn:hover{
  background:#1b202a;
}

/* MAIN */

.container{
  max-width:1450px;
  margin:auto;
  padding:26px 22px 80px;
}

.section{
  margin-bottom:34px;
}

.section-title{
  font-size:21px;
  margin:0;
  font-weight:800;
  letter-spacing:-.3px;
}

.section-subtitle{
  color:var(--muted);
  margin:5px 0 17px;
  font-size:14px;
}

/* TRENDING */

.trending{
  position:relative;
  overflow:hidden;
  min-height:390px;
  border-radius:22px;
  border:1px solid var(--border);
  background:#10131a;
  box-shadow:var(--shadow);
}

.trend-slide{
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
  transition:opacity .55s ease;
}

.trend-slide.active{
  opacity:1;
  pointer-events:auto;
}

.trend-bg{
  position:absolute;
  z-index:1;
  top:0;
  right:0;
  width:50%;
  height:100%;
  object-fit:cover;
  object-position:center;
}

.trend-overlay{
  position:absolute;
  z-index:2;
  inset:0;
  width:50%;
  background:linear-gradient(90deg,#10131a 0%,rgba(16,19,26,.98) 75%,rgba(16,19,26,.75) 100%);
}

.trend-content{
  position:relative;
  z-index:3;
  min-height:390px;
  width:50%;
  padding:42px 40px;
  display:flex;
  justify-content:center;
  flex-direction:column;
}

.trend-type{
  color:#b5bbc5;
  text-transform:uppercase;
  font-size:11px;
  font-weight:800;
  letter-spacing:1.2px;
  margin-bottom:10px;
}

.trend-title{
  font-size:40px;
  line-height:1.03;
  margin:0 0 12px;
  letter-spacing:-1.3px;
}

.trend-meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  color:#d7dbe1;
  font-size:13px;
  margin-bottom:15px;
}

.rating{
  color:var(--gold);
  font-weight:800;
}

.trend-overview{
  color:#d1d5db;
  line-height:1.6;
  font-size:14px;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.trend-btn{
  width:max-content;
  margin-top:18px;
  padding:10px 16px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#080a0f;
  font-weight:750;
}

.trend-dots{
  position:absolute;
  z-index:4;
  bottom:16px;
  left:48px;
  display:flex;
  gap:6px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  border:0;
  padding:0;
  background:#69707c;
}

.dot.active{
  width:24px;
  border-radius:20px;
  background:#fff;
}

.trend-arrow{
  position:absolute;
  z-index:5;
  top:50%;
  transform:translateY(-50%);
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(0,0,0,.4);
  color:#fff;
}

.trend-prev{right:62px;bottom:15px;left:auto;top:auto;transform:none}
.trend-next{right:15px;bottom:15px;top:auto;transform:none}

/* BROWSE */

.browse-box{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  padding:13px;
}

.browse-row{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.browse-label{
  color:#aeb4bf;
  font-size:11px;
  font-weight:800;
  letter-spacing:1px;
  margin-right:2px;
}

.filter{
  position:relative;
}

.filter-btn{
  min-width:130px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:#181c25;
  color:#e8ebef;
  border:1px solid #2a303b;
  border-radius:9px;
  padding:8px 10px;
  font-size:12px;
}

.filter-btn:hover{
  background:#20252f;
}

.filter-menu{
  position:absolute;
  z-index:300;
  max-width:min(260px,calc(100vw - 28px));
  top:calc(100% + 7px);
  left:0;
  width:205px;
  max-height:280px;
  overflow:auto;
  background:#161a22;
  border:1px solid #303642;
  border-radius:12px;
  padding:6px;
  box-shadow:0 20px 45px rgba(0,0,0,.5);
}

.filter-menu button{
  width:100%;
  text-align:left;
  background:transparent;
  border:0;
  color:#dce0e6;
  padding:9px 10px;
  border-radius:8px;
  font-size:12px;
}

.filter-menu button:hover{
  background:#282e38;
}

.filter-menu button.selected{
  background:rgba(245,197,24,.14);
  color:var(--gold);
}

.apply-btn{
  background:var(--gold);
  color:#111318;
  border:0;
  border-radius:9px;
  padding:9px 16px;
  font-size:12px;
  font-weight:800;
}

.apply-btn:hover{
  background:#ffd84d;
}

/* RESULTS */

.results-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
  gap:15px;
}

.results-count{
  color:var(--muted);
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:17px;
}

.movie-card{
  min-width:0;
  cursor:pointer;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  overflow:hidden;
  transition:transform .2s,border-color .2s,box-shadow .2s;
}

.movie-card:hover{
  transform:translateY(-3px);
  border-color:#3a414d;
  box-shadow:0 15px 35px rgba(0,0,0,.25);
}

.poster-wrap{
  position:relative;
  aspect-ratio:2/3;
  background:#1b2029;
  overflow:hidden;
}

.poster{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.poster-type{
  position:absolute;
  top:9px;
  left:9px;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(5px);
  padding:5px 7px;
  border-radius:6px;
  font-size:9px;
  font-weight:800;
  text-transform:uppercase;
}

.card-body{
  padding:11px;
}

.card-title{
  font-size:14px;
  font-weight:750;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card-meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
  color:var(--muted);
  margin-top:7px;
  font-size:11px;
}

.card-rating{
  color:var(--gold);
  font-weight:800;
}

.card-date{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.card-actions{
  display:flex;
  gap:6px;
  margin-top:10px;
}

.details-btn{
  flex:1;
  background:#e9ebee;
  color:#080a0e;
  border:0;
  border-radius:8px;
  padding:7px 8px;
  font-size:11px;
  font-weight:800;
}

.quick-btn{
  width:34px;
  background:#20252e;
  border:1px solid #303640;
  color:#fff;
  border-radius:8px;
}

/* PAGINATION */

.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
  margin-top:28px;
  flex-wrap:wrap;
}

.page-btn{
  min-width:37px;
  height:37px;
  padding:0 10px;
  border-radius:9px;
  background:#161a22;
  color:#dce0e6;
  border:1px solid var(--border);
}

.page-btn:hover{
  background:#222832;
}

.page-btn.active{
  background:#e8eaed;
  color:#080a0e;
  border-color:#e8eaed;
  font-weight:800;
}

/* TIMELINE */

.timeline-wrap{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
}

.timeline{
  position:relative;
  padding:5px 0;
}

.timeline::before{
  content:"";
  position:absolute;
  left:16px;
  top:0;
  bottom:0;
  width:2px;
  background:#2a3039;
}

.timeline-item{
  position:relative;
  padding-left:45px;
  margin:0 0 18px;
}

.timeline-dot{
  position:absolute;
  left:9px;
  top:5px;
  width:16px;
  height:16px;
  border-radius:50%;
  background:#e5e7eb;
  border:4px solid var(--panel);
  z-index:2;
}

.timeline-card{
  background:#161a22;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:12px;
}

.timeline-poster{
  width:44px;
  height:62px;
  object-fit:cover;
  border-radius:7px;
}

.timeline-info{
  min-width:0;
  flex:1;
}

.timeline-name{
  font-size:13px;
  font-weight:800;
}

.timeline-date{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.timeline-status{
  font-size:10px;
  padding:5px 7px;
  border-radius:6px;
  font-weight:800;
}

.watched{
  background:rgba(34,197,94,.12);
  color:#86efac;
}

.scheduled{
  background:rgba(96,165,250,.12);
  color:#93c5fd;
}

/* DETAIL */

.detail-overlay{
  position:fixed;
  inset:0;
  z-index:5000;
  background:#080a0e;
  overflow:auto;
}

.detail-back{
  position:fixed;
  z-index:20;
  top:18px;
  left:18px;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(0,0,0,.52);
  color:#fff;
  backdrop-filter:blur(10px);
  border-radius:10px;
  padding:9px 13px;
}

.detail-hero{
  min-height:580px;
  position:relative;
  display:flex;
  align-items:flex-end;
  overflow:hidden;
}

.detail-bg{
  position:absolute;
  z-index:1;
  top:0;
  right:0;
  width:58%;
  height:100%;
  object-fit:cover;
  object-position:center;
}

.detail-bg-overlay{
  position:absolute;
  z-index:2;
  inset:0;
  background:
    linear-gradient(90deg,#080a0e 0%,rgba(8,10,14,.96) 32%,rgba(8,10,14,.52) 58%,rgba(8,10,14,.08) 100%),
    linear-gradient(0deg,#080a0e 0%,transparent 55%);
}

.detail-main{
  position:relative;
  z-index:3;
  max-width:1450px;
  width:100%;
  margin:auto;
  padding:80px 22px 45px;
  display:flex;
  gap:28px;
  align-items:flex-end;
}

.detail-poster{
  width:220px;
  flex:0 0 220px;
  aspect-ratio:2/3;
  object-fit:cover;
  border-radius:13px;
  box-shadow:0 25px 60px rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.1);
}

.detail-info{
  max-width:760px;
}

.detail-type{
  color:#adb4bf;
  font-size:11px;
  font-weight:800;
  letter-spacing:1.3px;
  text-transform:uppercase;
  margin-bottom:8px;
}

.detail-title{
  font-size:47px;
  line-height:1.03;
  margin:0 0 12px;
  letter-spacing:-1.7px;
}

.detail-meta{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:center;
  font-size:13px;
  color:#d4d8de;
  margin-bottom:15px;
}

.detail-overview{
  color:#d0d4da;
  line-height:1.65;
  font-size:14px;
  max-width:750px;
}

.detail-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:18px;
}

.action-btn{
  border:1px solid #303641;
  background:#181c24;
  color:#fff;
  border-radius:9px;
  padding:10px 13px;
  font-size:12px;
  font-weight:750;
}

.action-btn:hover{
  background:#242a34;
}

.action-btn.primary{
  background:#e9ebee;
  color:#080a0e;
  border-color:#e9ebee;
}

/* DETAIL CONTENT */

.detail-content{
  max-width:1450px;
  margin:auto;
  padding:30px 22px 80px;
}

.detail-section{
  margin-bottom:32px;
}

.detail-section h2{
  font-size:19px;
  margin:0 0 14px;
}

.horizontal{
  display:flex;
  gap:13px;
  overflow-x:auto;
  padding-bottom:8px;
  scrollbar-width:thin;
}

.horizontal-card{
  flex:0 0 150px;
  background:#12161d;
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
}

.horizontal-image{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  display:block;
}

.horizontal-body{
  padding:9px;
}

.horizontal-title{
  font-size:12px;
  font-weight:750;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.horizontal-meta{
  margin-top:5px;
  color:var(--muted);
  font-size:10px;
}

.cast-card{
  flex:0 0 115px;
}

.cast-image{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  border-radius:9px;
}

.cast-name{
  font-size:11px;
  font-weight:750;
  margin-top:7px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.cast-character{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* PROVIDERS */

.providers{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.provider{
  display:flex;
  align-items:center;
  gap:8px;
  background:#151922;
  border:1px solid var(--border);
  border-radius:10px;
  padding:7px 10px;
}

.provider img{
  width:25px;
  height:25px;
  border-radius:6px;
}

.provider span{
  font-size:11px;
}

/* SEASONS */

.season-bar{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:8px;
}

.season-btn{
  white-space:nowrap;
  background:#161a22;
  border:1px solid var(--border);
  color:#cfd4db;
  border-radius:9px;
  padding:9px 13px;
  font-size:11px;
}

.season-btn.active{
  background:#e8eaed;
  color:#080a0e;
  border-color:#e8eaed;
  font-weight:800;
}

.episodes{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}

.episode{
  display:flex;
  gap:13px;
  background:#13171e;
  border:1px solid var(--border);
  border-radius:13px;
  overflow:hidden;
  min-width:0;
}

.episode-image{
  width:220px;
  flex:0 0 220px;
  aspect-ratio:16/9;
  object-fit:cover;
  background:#1b2028;
}

.episode-info{
  padding:12px 12px 12px 0;
  min-width:0;
  flex:1;
}

.episode-name{
  font-size:13px;
  font-weight:800;
  margin-bottom:6px;
}

.episode-meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  color:var(--muted);
  font-size:10px;
}

.episode-overview{
  color:#aeb4bd;
  font-size:10px;
  line-height:1.5;
  margin-top:7px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.episode-actions{
  margin-top:9px;
}

.episode-action{
  border:1px solid #303640;
  background:#1a1f28;
  color:#fff;
  border-radius:7px;
  padding:6px 8px;
  font-size:10px;
}

/* RANDOM MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:7000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(10px);
}

.modal-box{
  width:min(620px,100%);
  max-height:92vh;
  overflow:auto;
  background:#12161d;
  border:1px solid #2b313c;
  border-radius:19px;
  padding:22px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}

.modal-head h2{
  margin:0;
  font-size:21px;
}

.close{
  width:34px;
  height:34px;
  border-radius:9px;
  background:#1c212a;
  color:#fff;
  border:1px solid #303641;
}

.option-title{
  font-size:11px;
  color:#9fa6b1;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.7px;
  margin:15px 0 8px;
}

.radio-row,
.check-row{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.choice{
  border:1px solid #2d333e;
  background:#181d25;
  color:#dfe3e8;
  border-radius:8px;
  padding:8px 10px;
  font-size:11px;
}

.choice.active{
  background:var(--gold);
  color:#111318;
  border-color:var(--gold);
  font-weight:800;
}

.check{
  display:flex;
  align-items:center;
  gap:7px;
  color:#cfd4db;
  font-size:11px;
  margin-top:8px;
}

.pick-btn{
  width:100%;
  margin-top:19px;
  border:0;
  border-radius:10px;
  background:#e8eaed;
  color:#080a0e;
  padding:12px;
  font-weight:850;
}

.random-result{
  margin-top:17px;
  cursor:pointer;
  display:none;
  background:#181c24;
  border:1px solid #303641;
  border-radius:13px;
  padding:10px;
  gap:12px;
}

.random-result.show{
  display:flex;
}

.random-result img{
  width:85px;
  height:125px;
  object-fit:cover;
  border-radius:8px;
}

.random-info{
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.random-name{
  font-weight:800;
  font-size:15px;
}

.random-meta{
  color:var(--muted);
  font-size:11px;
  margin-top:6px;
}

.random-actions{
  display:flex;
  gap:6px;
  margin-top:12px;
}

/* DATE MODAL */

.date-box{
  width:min(380px,100%);
}

/* TO TOP */

.to-top{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:1200;
  width:43px;
  height:43px;
  border-radius:50%;
  border:1px solid #353b46;
  background:#171b23;
  color:#fff;
  font-size:18px;
  box-shadow:0 12px 30px rgba(0,0,0,.4);
}

.to-top:hover{
  background:#252b35;
}

/* LOADING */

.loading{
  padding:50px 20px;
  text-align:center;
  color:var(--muted);
}

.spinner{
  width:25px;
  height:25px;
  border:3px solid #303640;
  border-top-color:#fff;
  border-radius:50%;
  margin:0 auto 12px;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.empty{
  padding:40px 15px;
  color:var(--muted);
  text-align:center;
  border:1px dashed #2d333d;
  border-radius:13px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(30px);
  opacity:0;
  z-index:10000;
  background:#eceef1;
  color:#080a0e;
  padding:10px 15px;
  border-radius:9px;
  font-size:12px;
  font-weight:750;
  transition:.25s;
  pointer-events:none;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}


/* SEARCH SUGGESTIONS */
.search-wrap{max-width:430px}
.search{padding:9px 13px 9px 36px;height:40px;font-size:13px}
.search-suggestions{position:absolute;left:0;right:0;top:calc(100% + 7px);z-index:5000;background:#12161d;border:1px solid #303641;border-radius:12px;box-shadow:0 22px 50px rgba(0,0,0,.55);overflow:hidden;max-height:390px;overflow-y:auto}
.search-suggestion{display:flex;gap:10px;align-items:center;padding:8px 10px;border:0;background:transparent;color:#fff;width:100%;text-align:left}
.search-suggestion:hover{background:#1d232d}
.search-suggestion img{width:34px;height:50px;object-fit:cover;border-radius:5px;flex:0 0 34px}
.search-suggestion strong{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-suggestion small{display:block;color:var(--muted);font-size:10px;margin-top:3px}

/* FULL PAGE TIMELINE / RANDOM */
.page-overlay{position:fixed;inset:0;z-index:6000;background:#090b10;overflow:auto}
.page-shell{max-width:1450px;margin:auto;padding:26px 22px 80px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding-bottom:22px;border-bottom:1px solid var(--border);margin-bottom:24px}
.page-head h1{margin:0;font-size:30px}.page-head p{margin:6px 0 0;color:var(--muted)}
.timeline-columns{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:0;
  padding:18px 0 30px;
}
.timeline-columns::before{
  content:"";
  position:absolute;
  top:18px;
  bottom:30px;
  left:50%;
  width:2px;
  transform:translateX(-50%);
  background:linear-gradient(to bottom,transparent,#2d3948 6%,#2d3948 94%,transparent);
  pointer-events:none;
}
.timeline-column{
  background:transparent;
  border:0;
  border-radius:0;
  padding:0 28px;
}
.timeline-column:first-child{
  border-right:0;
}
.timeline-column h2{
  position:relative;
  z-index:1;
  font-size:16px;
  margin:0 0 18px;
  padding:11px 14px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#11161e;
  box-shadow:0 10px 28px rgba(0,0,0,.16);
}
.timeline-column:first-child h2{text-align:right}
.timeline-column:last-child h2{text-align:left}
.timeline-entry{
  position:relative;
  display:flex;
  gap:13px;
  align-items:center;
  width:calc(100% - 18px);
  padding:11px;
  border:1px solid var(--border);
  border-radius:14px;
  background:linear-gradient(135deg,#151a22,#11151c);
  margin-bottom:12px;
  cursor:pointer;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.timeline-entry:hover{
  transform:translateY(-2px);
  border-color:#3a4758;
  box-shadow:0 12px 30px rgba(0,0,0,.25);
}
.timeline-entry::after{
  content:"";
  position:absolute;
  top:50%;
  width:18px;
  height:2px;
  background:#2d3948;
}
.timeline-column:first-child .timeline-entry{
  margin-left:auto;
}
.timeline-column:first-child .timeline-entry::after{right:-18px}
.timeline-column:last-child .timeline-entry::after{left:-18px}
.timeline-entry img{
  width:62px;
  height:88px;
  object-fit:cover;
  border-radius:8px;
  flex:0 0 62px;
  background:#0c1016;
}
.timeline-entry .te-info{min-width:0;flex:1}
.timeline-entry .te-title{
  font-size:13px;
  font-weight:800;
  line-height:1.3;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.timeline-entry .te-date{font-size:10px;color:var(--muted);margin-top:6px}
.timeline-entry .te-type{
  display:inline-block;
  font-size:9px;
  color:#b8c1cc;
  margin-top:5px;
  text-transform:uppercase;
  letter-spacing:.06em;
}
.timeline-entry .te-status{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-top:7px;
  font-size:9px;
  font-weight:800;
  letter-spacing:.04em;
}
.timeline-entry .te-status.watched{color:#6ee7b7}
.timeline-entry .te-status.scheduled{color:#fbbf24}
.timeline-empty{
  padding:28px 16px;
  border:1px dashed #2d3948;
  border-radius:14px;
  color:var(--muted);
  text-align:center;
  background:#10141b;
}
#randomModal.modal{background:#090b10;backdrop-filter:none;align-items:stretch;padding:0}
#randomModal .modal-box{width:min(700px,calc(100% - 28px));max-height:none;margin:auto;background:#11141b;border-radius:18px}
#randomModal .random-result{cursor:pointer}
.random-result img{cursor:pointer}.random-name{cursor:pointer}

/* DETAIL provider links */
.provider{cursor:pointer;text-decoration:none}.provider:hover{background:#1e242e}

@media(max-width:700px){.timeline-columns{grid-template-columns:1fr}.page-shell{padding:18px 14px 60px}.page-head h1{font-size:25px}.search-wrap{max-width:none}.search{height:38px}}


/* FINAL RANDOM PICKER / SEARCH / TIMELINE POLISH */
.random-page{background:#090b10;overflow:auto;padding:0}
.random-page-shell{width:min(900px,calc(100% - 28px));min-height:100vh;margin:0 auto;padding:26px 0 70px}

<script>
/* ============================================================
   MOVIE TRACKER - SINGLE FILE APP
   TMDB API
============================================================ */

const API_KEY = "9c95420163879f1c4726c540b305cbc6";
const API_BASE = "https://api.themoviedb.org/3";
const IMG_BASE = "https://image.tmdb.org/t/p/";
const POSTER_SIZE = "w500";
const BACKDROP_SIZE = "original";
const PROFILE_SIZE = "w185";
const STILL_SIZE = "w780";

/* ============================================================
   STATE
============================================================ */

const state = {
  page: 1,
  currentResults: [],
  currentDetail: null,
  currentSeason: null,

  filters: {
    type: "all",
    year: "",
    popular: "popular",
    genre: "",
    country: ""
  },

  random: {
    type: "all",
    genre: "",
    popularity: "any",
    used: [],
    last: null
  },

  trending: [],
  trendIndex: 0,
  trendTimer: null,

  dateAction: null
};

/* ============================================================
   LOCAL STORAGE
============================================================ */

const STORAGE_WATCHED = "movieTrackerWatchedV2";
const STORAGE_SCHEDULED = "movieTrackerScheduledV2";

function getWatched(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_WATCHED)) || {};
  }catch{
    return {};
  }
}

function getScheduled(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_SCHEDULED)) || {};
  }catch{
    return {};
  }
}

function saveWatched(data){
  localStorage.setItem(STORAGE_WATCHED, JSON.stringify(data));
}

function saveScheduled(data){
  localStorage.setItem(STORAGE_SCHEDULED, JSON.stringify(data));
}

/* ============================================================
   HELPERS
============================================================ */

function esc(value){
  if(value === null || value === undefined) return "";
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function image(path, size=POSTER_SIZE){
  return path
    ? IMG_BASE + size + path
    : "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="500" height="750">
        <rect width="100%" height="100%" fill="#1b2028"/>
        <text x="50%" y="50%" dominant-baseline="middle"
              text-anchor="middle" fill="#7b8390"
              font-family="Arial" font-size="24">No Image</text>
      </svg>
    `);
}

function backdrop(path){
  return path
    ? IMG_BASE + BACKDROP_SIZE + path
    : image(null, POSTER_SIZE);
}

function yearFromDate(date){
  return date ? String(date).slice(0,4) : "—";
}

function formatDate(date){
  if(!date) return "Release date unavailable";
  const d = new Date(date + "T00:00:00");
  if(Number.isNaN(d.getTime())) return date;
  return d.toLocaleDateString("en-US", {
    month:"long",
    day:"numeric",
    year:"numeric"
  });
}

function titleOf(item){
  return item.media_type === "tv" ? item.name : item.title;
}

function dateOf(item){
  return item.media_type === "tv"
    ? item.first_air_date
    : item.release_date;
}

function mediaType(item){
  if(item.media_type) return item.media_type;
  return item.first_air_date !== undefined ? "tv" : "movie";
}

function uniqueItems(items){
  const seen = new Set();
  return items.filter(item=>{
    const type = mediaType(item);
    const key = type + ":" + item.id;

    if(seen.has(key)) return false;

    seen.add(key);
    return true;
  });
}

function uniqueAgainst(items, existing){
  const seen = new Set(existing.map(item=>{
    return mediaType(item) + ":" + item.id;
  }));

  return items.filter(item=>{
    const key = mediaType(item) + ":" + item.id;

    if(seen.has(key)) return false;

    seen.add(key);
    return true;
  });
}

function sleep(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

function toast(message){
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.add("show");

  clearTimeout(toast.timer);

  toast.timer = setTimeout(()=>{
    el.classList.remove("show");
  },2200);
}

/* ============================================================
   API
============================================================ */

async function api(path, params={}){
  const url = new URL(API_BASE + path);

  // Keep the existing TMDB key/config exactly as provided.
  url.searchParams.set("api_key", API_KEY);
  url.searchParams.set("language", "en-US");

  Object.entries(params).forEach(([key,value])=>{
    if(value !== undefined && value !== null && value !== ""){
      url.searchParams.set(key,value);
    }
  });

  // Never allow a network request to leave the UI stuck on a spinner.
  const controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(), 12000);

  try{
    const response = await fetch(url, {
      method: "GET",
      headers: { "Accept": "application/json" },
      signal: controller.signal,
      cache: "no-store"
    });

    if(!response.ok){
      let detail = "";
      try{
        const body = await response.json();
        detail = body?.status_message || "";
      }catch{}
      throw new Error("TMDB request failed: " + response.status + (detail ? " — " + detail : ""));
    }

    return await response.json();
  }catch(error){
    if(error?.name === "AbortError") {
      throw new Error("TMDB request timed out. Check your internet connection and API key.");
    }
    throw error;
  }finally{
    clearTimeout(timeout);
  }
}

/* ============================================================
   TRENDING
============================================================ */

async function loadTrending(){
  const box = document.getElementById("trendingBox");

  try{
    const trendType = state.filters.type;
    const trendEndpoint =
      trendType === "movie" ? "/trending/movie/day" :
      trendType === "tv" ? "/trending/tv/day" :
      "/trending/all/day";

    const data = await api(trendEndpoint, {
      page:1
    });

    let items = uniqueItems(
      (data.results || [])
        .filter(x => x.media_type === "movie" || x.media_type === "tv")
    ).slice(0,8);

    state.trending = items;

    if(!items.length){
      box.innerHTML = `<div class="empty">No trending recommendations found.</div>`;
      return;
    }

    renderTrending();
    startTrendingTimer();

  }catch(error){
    console.error("Trending load failed:", error);
    box.innerHTML = `
      <div class="empty trending-error">
        <strong>Unable to load trending recommendations.</strong>
        <span>${esc(error?.message || "TMDB could not be reached.")}</span>
        <button class="pick-btn" type="button" onclick="loadTrending()">Retry</button>
      </div>`;
  }
}

function renderTrending(){
  const box = document.getElementById("trendingBox");

  box.innerHTML = state.trending.map((item,index)=>{
    const type = mediaType(item);
    const title = titleOf(item);
    const date = dateOf(item);

    return `
      <div class="trend-slide ${index===state.trendIndex ? "active":""}"
           data-index="${index}"
           onclick="if(!event.target.closest('button'))openDetails(${item.id},'${type}')">
        <div class="trend-visual">
          <img class="trend-bg" src="${backdrop(item.backdrop_path)}" alt="${esc(title)}">
          <img class="trend-poster" src="${image(item.poster_path, POSTER_SIZE)}" alt="${esc(title)}">
        </div>

        <div class="trend-overlay"></div>

        <div class="trend-content">
          <div class="trend-type">
            ${type === "tv" ? "TV SHOW" : "MOVIE"}
          </div>

          <h2 class="trend-title">${esc(title)}</h2>

          <div class="trend-meta">
            <span>${esc(formatDate(date))}</span>
            <span>•</span>
            <span class="rating">
              ★ ${Number(item.vote_average || 0).toFixed(1)}
            </span>
          </div>

          <div class="trend-overview">
            ${esc(item.overview || "No overview available.")}
          </div>

          <button class="trend-btn"
                  onclick="openDetails(${item.id}, '${type}')">
            View Details
          </button>
        </div>
      </div>
    `;
  }).join("") + `
    <button class="trend-arrow trend-prev" onclick="changeTrend(-1)">‹</button>
    <button class="trend-arrow trend-next" onclick="changeTrend(1)">›</button>

    <div class="trend-dots">
      ${state.trending.map((_,i)=>`
        <button class="dot ${i===state.trendIndex ? "active":""}"
                onclick="setTrend(${i})"></button>
      `).join("")}
    </div>
  `;
}

function setTrend(index){
  if(!state.trending.length) return;

  state.trendIndex =
    (index + state.trending.length) % state.trending.length;

  document.querySelectorAll(".trend-slide").forEach((el,i)=>{
    el.classList.toggle("active",i===state.trendIndex);
  });

  document.querySelectorAll(".trend-dots .dot").forEach((el,i)=>{
    el.classList.toggle("active",i===state.trendIndex);
  });
}

function changeTrend(delta){
  setTrend(state.trendIndex + delta);
  restartTrendingTimer();
}

function startTrendingTimer(){
  clearInterval(state.trendTimer);

  state.trendTimer = setInterval(()=>{
    changeTrend(1);
  },4000);
}

function restartTrendingTimer(){
  clearInterval(state.trendTimer);

  state.trendTimer = setInterval(()=>{
    changeTrend(1);
  },4000);
}

function getGenreName(id){
  const found = [...MOVIE_GENRES,...TV_GENRES]
    .find(g=>String(g[0])===String(id));

  return found ? found[1] : "";
}

function setupFilters(){
  const menus = document.querySelectorAll(".filter[data-filter]");

  menus.forEach(filter=>{
    const type = filter.dataset.filter;
    const menu = filter.querySelector(".filter-menu");
    const button = filter.querySelector(".filter-btn");

    button.addEventListener("click",(event)=>{
      event.stopPropagation();

      document.querySelectorAll(".filter-menu").forEach(m=>{
        if(m !== menu) m.classList.add("hidden");
      });

      menu.classList.toggle("hidden");
    });

    buildFilterMenu(type,menu);
  });

  document.addEventListener("click",event=>{
    document.querySelectorAll(".filter-menu").forEach(m=>m.classList.add("hidden"));
    if(!event.target.closest(".search-wrap")) document.getElementById("searchSuggestions")?.classList.add("hidden");
  });
}

function buildFilterMenu(type,menu){
  let html = "";

  if(type === "type"){
    html = [
      ["all","Movies & TV Shows"],
      ["movie","Movies"],
      ["tv","TV Shows"]
    ].map(x=>`
      <button data-value="${x[0]}"
              class="${state.filters.type===x[0]?"selected":""}">
        ${x[1]}
      </button>
    `).join("");
  }

  if(type === "year"){
    const current = new Date().getFullYear();

    html = `<button data-value="">All Years</button>`;

    for(let y=current;y>=1970;y--){
      html += `<button data-value="${y}">${y}</button>`;
    }
  }

  if(type === "popular"){
    const options = [
      ["popular","Popular"],
      ["alltime","All Time Popular"],
      ["today","Today Popular"],
      ["month","This Month Popular"],
      ["high","High Rated"]
    ];

    html = options.map(x=>`
      <button data-value="${x[0]}">${x[1]}</button>
    `).join("");
  }

  if(type === "genre"){
    html = `<button data-value="">All Genres</button>`;

    const genres = [
      ["bollywood","Bollywood"],
      ...MOVIE_GENRES.map(g=>[String(g[0]),g[1]])
    ].sort((a,b)=>a[1].localeCompare(b[1]));

    genres.forEach(g=>{
      html += `<button data-value="${g[0]}">${g[1]}</button>`;
    });
  }

  if(type === "country"){
    html = `<button data-value="">All Countries</button>` +
      [...COUNTRIES]
        .sort((a,b)=>a[1].localeCompare(b[1]))
        .map(c=>`<button data-value="${c[0]}">${c[1]}</button>`)
        .join("");
  }

  menu.innerHTML = html;

  menu.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click",(event)=>{
      event.stopPropagation();

      const value = btn.dataset.value;

      state.filters[type] = value;

      updateFilterLabels();

      menu.classList.add("hidden");

      if(type === "type"){
        state.page = 1;
        Promise.allSettled([
          loadTrending(),
          loadBrowse()
        ]);
      }
    });
  });
}

function updateFilterLabels(){
  const f = state.filters;

  document.getElementById("typeLabel").textContent =
    f.type === "movie" ? "Movies" :
    f.type === "tv" ? "TV Shows" :
    "Movies & TV Shows";

  document.getElementById("yearLabel").textContent =
    f.year || "All Years";

  const popularNames = {
    popular:"Popular",
    alltime:"All Time Popular",
    today:"Today Popular",
    month:"This Month Popular",
    high:"High Rated"
  };

  document.getElementById("popularLabel").textContent =
    popularNames[f.popular] || "Popular";

  document.getElementById("genreLabel").textContent =
    f.genre === "bollywood"
      ? "Bollywood"
      : f.genre
        ? getGenreName(f.genre)
        : "All Genres";

  const country = COUNTRIES.find(c=>c[0] === f.country);
  document.getElementById("countryLabel").textContent =
    country ? country[1] : "All Countries";

  document.querySelectorAll(".global-media-btn").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.value === f.type);
  });

}

function discoverParams(type,page,extra={}){
  const params = {
    page,
    include_adult:false,
    sort_by:"popularity.desc"
  };

  if(state.filters.year){
    if(type === "movie"){
      params.primary_release_year = state.filters.year;
    }else{
      params.first_air_date_year = state.filters.year;
    }
  }

  if(state.filters.genre && state.filters.genre !== "bollywood"){
    params.with_genres = state.filters.genre;
  }

  if(state.filters.country){
    params.with_origin_country = state.filters.country;
  }

  if(state.filters.popular === "high"){
    params.sort_by = "vote_average.desc";
    params.vote_count_gte = 200;
  }

  if(state.filters.popular === "alltime"){
    params.sort_by = "popularity.desc";
  }

  return {
    ...params,
    ...extra
  };
}

/*
  TMDB gives max 20 results/page.
  App page = 50 unique items.
  Therefore each app page gathers 3 TMDB pages.
*/
async function fetch50(type,appPage){
  const tmdbStart = ((appPage - 1) * 3) + 1;

  let collected = [];

  for(let i=0;i<3;i++){
    const tmdbPage = tmdbStart + i;

    const data = await api(
      type === "tv" ? "/discover/tv" : "/discover/movie",
      discoverParams(type,tmdbPage)
    );

    const results = (data.results || []).map(item=>({
      ...item,
      media_type:type
    }));

    collected = uniqueAgainst(results,collected);

    if(collected.length >= 50) break;
  }

  return collected.slice(0,50);
}

async function loadBrowse(){
  showResultsLoading();

  try{
    let items = [];

    if(state.filters.genre === "bollywood"){
      items = await loadBollywood(state.filters.type,state.page);
    }else if(state.filters.type === "all"){
      const [movies,tv] = await Promise.all([
        fetch50("movie",state.page),
        fetch50("tv",state.page)
      ]);

      items = uniqueItems([...movies,...tv]);

      /*
        Keep exactly up to 50 unique items.
        Movies and TV are mixed.
      */
      items = items
        .sort((a,b)=>
          Number(b.popularity||0)-Number(a.popularity||0)
        )
        .slice(0,50);
    }else{
      items = await fetch50(state.filters.type,state.page);
    }

    state.currentResults = uniqueItems(items);

    renderResults();

    updatePagination();

  }catch(error){
    console.error(error);

    document.getElementById("results").innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        Unable to load results. Please try again.
      </div>
    `;

    document.getElementById("pagination").innerHTML = "";
  }
}

async function loadBollywood(type,page){
  /*
    Bollywood custom filter:
    Hindi language + India origin/keyword-style discovery.
  */

  const types = type === "all"
    ? ["movie","tv"]
    : [type];

  let all = [];

  for(const currentType of types){
    const endpoint =
      currentType === "movie"
        ? "/discover/movie"
        : "/discover/tv";

    const params = {
      page,
      with_original_language:"hi",
      with_origin_country:"IN",
      sort_by:"popularity.desc"
    };

    if(state.filters.year){
      if(currentType === "movie"){
        params.primary_release_year = state.filters.year;
      }else{
        params.first_air_date_year = state.filters.year;
      }
    }

    const data = await api(endpoint,params);

    all.push(
      ...(data.results || []).map(item=>({
        ...item,
        media_type:currentType
      }))
    );
  }

  return uniqueItems(all).slice(0,50);
}

/* ============================================================
   PAGINATION
============================================================ */

function updatePagination(){
  const box = document.getElementById("pagination");

  /*
    We deliberately don't display total pages.
    Only previous, nearby page numbers and next.
  */

  let html = "";

  if(state.page > 1){
    html += `
      <button class="page-btn"
              onclick="goPage(${state.page-1})">
        ← Previous
      </button>
    `;
  }

  const start = Math.max(1,state.page-2);
  const end = state.page+2;

  for(let p=start;p<=end;p++){
    html += `
      <button class="page-btn ${p===state.page?"active":""}"
              onclick="goPage(${p})">
        ${p}
      </button>
    `;
  }

  html += `
    <button class="page-btn"
            onclick="goPage(${state.page+1})">
      Next →
    </button>
  `;

  box.innerHTML = html;
}

async function goPage(page){
  if(page < 1) return;

  state.page = page;

  await loadBrowse();

  /*
    Pagination changes don't produce the old
    scroll-for-more glitch.
  */
  window.scrollTo({
    top:document.querySelector(".section").offsetTop - 75,
    behavior:"smooth"
  });
}

async function openDetails(id,type,fromRandom=false){
  document.getElementById("randomModal")?.classList.add("hidden");
  document.getElementById("timelinePage")?.classList.add("hidden");
  const overlay = document.getElementById("detailOverlay");

  overlay.classList.remove("hidden");

  document.body.style.overflow = "hidden";

  document.getElementById("detailHero").innerHTML = `
    <div class="loading" style="width:100%;padding-top:150px">
      <div class="spinner"></div>
      Loading details...
    </div>
  `;

  document.getElementById("detailContent").innerHTML = "";

  try{
    const [details,credits,providers] = await Promise.all([
      api(`/${type}/${id}`),
      api(`/${type}/${id}/credits`),
      api(`/${type}/${id}/watch/providers`)
    ]);

    details.media_type = type;

    state.currentDetail = details;
    state.currentSeason = null;
    if(!fromRandom && !window.__popstateDetail){
      history.pushState({view:"detail",id,type},"",`#${type}-${id}`);
    }

    renderDetail(details,credits,providers);

    window.scrollTo(0,0);

  }catch(error){
    console.error(error);

    document.getElementById("detailHero").innerHTML = `
      <div class="empty" style="width:100%;margin:100px 20px">
        Unable to load details.
      </div>
    `;
  }
}

function renderDetailContent(details,credits,providers){
  const content = document.getElementById("detailContent");

  let html = "";

  /* CAST */

  const cast = (credits.cast || []).slice(0,30);

  if(cast.length){
    html += `
      <section class="detail-section">
        <h2>Cast</h2>

        <div class="horizontal">
          ${cast.map(person=>`
            <div class="cast-card">
              <img class="cast-image"
                   src="${image(person.profile_path,PROFILE_SIZE)}"
                   alt="${esc(person.name)}"
                   loading="lazy">

              <div class="cast-name">${esc(person.name)}</div>

              <div class="cast-character">
                ${esc(person.character || "")}
              </div>
            </div>
          `).join("")}
        </div>
      </section>
    `;
  }

  /* PROVIDERS */

  const region =
    providers.results?.IN ||
    providers.results?.US ||
    providers.results?.GB;

  if(region){
    const providerList = uniqueItems(
      [
        ...(region.flatrate || []),
        ...(region.rent || []),
        ...(region.buy || [])
      ].map(p=>({
        id:p.provider_id,
        title:p.provider_name,
        poster_path:p.logo_path,
        media_type:"provider"
      }))
    );

    if(providerList.length){
      html += `
        <section class="detail-section">
          <h2>Available On</h2>

          <div class="providers">
            ${providerList.slice(0,12).map(p=>`
              <a class="provider" href="${PROVIDER_URLS[p.id] || "#"}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">
                <img src="${image(p.poster_path,"w92")}" alt="${esc(p.title)}">
                <span>${esc(p.title)}</span>
              </a>
            `).join("")}
          </div>
        </section>
      `;
    }
  }

  /* TV SHOW SEASONS */

  if(details.media_type === "tv"){
    const seasons = (details.seasons || [])
      .filter(s=>s.season_number >= 0)
      .sort((a,b)=>{
        if(a.season_number===0) return 1;
        if(b.season_number===0) return -1;
        return a.season_number-b.season_number;
      });

    html += `
      <section class="detail-section">
        <h2>Seasons & Episodes</h2>

        <div id="seasonBar" class="season-bar">
          ${seasons.map((season,index)=>`
            <button class="season-btn ${index===0?"active":""}"
                    onclick="loadSeason(${details.id},${season.season_number},this)">
              ${season.season_number === 0 ? "Specials" : "Season "+season.season_number}
            </button>
          `).join("")}
        </div>

        <div id="episodesBox" style="margin-top:15px">
          <div class="loading">
            <div class="spinner"></div>
            Loading episodes...
          </div>
        </div>
      </section>
    `;
  }

  /* MOVIE COLLECTION / FRANCHISE */

  if(details.media_type === "movie" && details.belongs_to_collection){
    html += `
      <section class="detail-section">
        <h2>${esc(details.belongs_to_collection.name)}</h2>

        <div id="collectionBox">
          <div class="loading">
            <div class="spinner"></div>
            Loading franchise...
          </div>
        </div>
      </section>
    `;
  }

  /* RELATED */

  html += `
    <section class="detail-section">
      <h2>${details.media_type === "tv" ? "You May Also Like" : "Related Movies"}</h2>

      <div id="relatedBox">
        <div class="loading">
          <div class="spinner"></div>
          Loading recommendations...
        </div>
      </div>
    </section>
  `;

  content.innerHTML = html;

  if(details.media_type === "tv"){
    const firstSeason =
      (details.seasons || [])
        .find(s=>s.season_number >= 0);

    if(firstSeason){
      loadSeason(details.id,firstSeason.season_number);
    }
  }

  if(details.media_type === "movie" && details.belongs_to_collection){
    loadCollection(details.belongs_to_collection.id);
  }

  loadRelated(details.id,details.media_type);
}

async function loadSeason(tvId,seasonNumber,clickedButton=null){
  state.currentSeason = seasonNumber;

  document.querySelectorAll(".season-btn").forEach(btn=>{
    btn.classList.remove("active");
  });

  if(clickedButton){
    clickedButton.classList.add("active");
  }else{
    const buttons = document.querySelectorAll(".season-btn");

    buttons.forEach(btn=>{
      if(btn.textContent.includes(
        seasonNumber === 0 ? "Specials" : "Season "+seasonNumber
      )){
        btn.classList.add("active");
      }
    });
  }

  const box = document.getElementById("episodesBox");

  if(!box) return;

  box.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      Loading season ${seasonNumber}...
    </div>
  `;

  try{
    const data = await api(
      `/tv/${tvId}/season/${seasonNumber}`
    );

    const episodes = data.episodes || [];

    if(!episodes.length){
      box.innerHTML = `
        <div class="empty">No episodes available.</div>
      `;
      return;
    }

    box.innerHTML = `
      <div class="episodes">
        ${episodes.map(ep=>{
          const watchedKey =
            `tv:${tvId}:s${seasonNumber}:e${ep.episode_number}`;

          const watched = getWatched()[watchedKey];

          return `
            <article class="episode">

              <img class="episode-image"
                   src="${image(ep.still_path,STILL_SIZE)}"
                   alt="${esc(ep.name)}"
                   loading="lazy">

              <div class="episode-info">

                <div class="episode-name">
                  ${ep.episode_number}. ${esc(ep.name || "Untitled Episode")}
                </div>

                <div class="episode-meta">
                  <span>
                    ${esc(formatDate(ep.air_date))}
                  </span>

                  <span class="rating">
                    ★ ${Number(ep.vote_average||0).toFixed(1)}
                  </span>

                  ${
                    watched
                      ? `<span style="color:#86efac">✓ Watched ${esc(watched.date)}</span>`
                      : ""
                  }
                </div>

                <div class="episode-overview">
                  ${esc(ep.overview || "No episode overview available.")}
                </div>

                <div class="episode-actions">
                  <button class="episode-action"
                          onclick="openEpisodeDatePicker(
                            'watched',
                            ${tvId},
                            ${seasonNumber},
                            ${ep.episode_number},
                            '${esc(ep.name || "")}',
                            '${ep.still_path || ""}'
                          )">
                    ${watched ? "✓ Watched" : "Mark Watched"}
                  </button>

                  <button class="episode-action"
                          onclick="openEpisodeDatePicker(
                            'scheduled',
                            ${tvId},
                            ${seasonNumber},
                            ${ep.episode_number},
                            '${esc(ep.name || "")}',
                            '${ep.still_path || ""}'
                          )">
                    Schedule
                  </button>
                </div>

              </div>
            </article>
          `;
        }).join("")}
      </div>
    `;

  }catch(error){
    console.error(error);

    box.innerHTML = `
      <div class="empty">
        Unable to load this season.
      </div>
    `;
  }
}

  const scheduled = getScheduled();

function openEpisodeDatePicker(
  action,
  tvId,
  seasonNumber,
  episodeNumber,
  episodeName,
  stillPath
){
  state.dateAction = {
    action,
    id:tvId,
    type:"tv",
    episode:true,
    season:seasonNumber,
    episodeNumber,

  };

function saveDateAction(){
  const date = document.getElementById("selectedDate").value;

  if(!date){
    toast("Please select a date.");
    return;
  }

  const action = state.dateAction;

  if(!action) return;

  if(action.episode){
    const key =
      `tv:${action.id}:s${action.season}:e${action.episodeNumber}`;

    const data =
      action.action === "watched"
        ? getWatched()
        : getScheduled();

    data[key] = {
      id:action.id,
      type:"tv",
      season:action.season,
      episode:action.episodeNumber,
      episodeName:action.episodeName,
      stillPath:action.stillPath,
      date,
      savedAt:Date.now()
    };

    if(action.action === "watched"){
      saveWatched(data);
    }else{
      saveScheduled(data);
    }

  }else{
    const key = `${action.type}:${action.id}`;

    const details = state.currentDetail;

    const entry = {
      id:action.id,
      type:action.type,
      title:details ? titleOf(details) : "",
      posterPath:details?.poster_path || "",
      date,
      savedAt:Date.now()
    };

    const data =
      action.action === "watched"
        ? getWatched()
        : getScheduled();

    data[key] = entry;

    if(action.action === "watched"){
      saveWatched(data);
    }else{
      saveScheduled(data);
    }
  }

  document.getElementById("dateModal").classList.add("hidden");

  renderTimeline();
  if(!document.getElementById("timelinePage").classList.contains("hidden")) renderTimelinePage();

  toast(
    action.action === "watched"
      ? "Saved as watched."
      : "Added to schedule."
  );
}

function renderTimeline(){
  const box = document.getElementById("timeline");

  // The timeline now lives on its own page. Do not try to render
  // into the old inline container when it is not present.
  if(!box){
    return;
  }

  const watched = getWatched();
  const scheduled = getScheduled();

  const items = [];

  Object.values(watched).forEach(item=>{
    items.push({
      ...item,
      status:"watched"
    });
  });

  Object.values(scheduled).forEach(item=>{
    items.push({
      ...item,
      status:"scheduled"
    });
  });

  items.sort((a,b)=>{
    return String(b.date || "").localeCompare(String(a.date || ""));
  });

  if(!items.length){
    box.innerHTML = `
      <div class="empty">
        Nothing on your timeline yet.<br>
        Mark a movie/TV Show as watched or schedule one.
      </div>
    `;
    return;
  }

  box.innerHTML = items.map(item=>{

    const title =
      item.episode
        ? `${item.title || "TV Show"} — S${item.season} E${item.episode}`
        : item.title || "Untitled";

    return `
      <div class="timeline-item">

        <div class="timeline-dot"></div>

        <div class="timeline-card">

          <img class="timeline-poster"
               src="${image(
                 item.posterPath ||

async function pickRandom(){
  const btn = document.getElementById("pickBtn");

  btn.disabled = true;
  btn.textContent = "Finding something for you...";

  try{
    let types =
      state.random.type === "all"
        ? ["movie","tv"]
        : [state.random.type];

    let candidates = [];

    for(const type of types){
      let results = [];

      /*
        Use multiple TMDB pages so random picker
        has a meaningful pool.
      */
      for(let page=1;page<=3;page++){
        let endpoint =
          type === "movie"
            ? "/discover/movie"
            : "/discover/tv";

        const params = {
          page,
          sort_by:"popularity.desc"
        };


        if(state.random.genre && state.random.genre !== "bollywood"){
          const genreIds = type === "tv" ? TV_GENRES.map(g=>String(g[0])) : MOVIE_GENRES.map(g=>String(g[0]));
          if(genreIds.includes(String(state.random.genre))) params.with_genres = state.random.genre;
        }

        if(state.random.genre === "bollywood"){
          params.with_original_language = "hi";
          params.with_origin_country = "IN";
        }

        const data = await api(endpoint,params);

        results.push(
          ...(data.results || []).map(item=>({
            ...item,
            media_type:type
          }))
        );
      }

      candidates.push(...results);
    }

    candidates = uniqueItems(candidates);

    /*
      Bollywood custom random filtering.
    */
    if(state.random.genre === "bollywood"){
      candidates = candidates.filter(item=>{
        return (
          item.original_language === "hi" ||
          item.origin_country?.includes("IN")
        );
      });
    }

    const watched = getWatched();
    const scheduled = getScheduled();

    if(document.getElementById("excludeWatched").checked){
      candidates = candidates.filter(item=>{
        return !watched[`${mediaType(item)}:${item.id}`];
      });
    }

    if(document.getElementById("excludeScheduled").checked){
      candidates = candidates.filter(item=>{
        return !scheduled[`${mediaType(item)}:${item.id}`];
      });
    }

    /*
      Session duplicate prevention.
    */
    candidates = candidates.filter(item=>{
      const key = `${mediaType(item)}:${item.id}`;
      return !state.random.used.includes(key);
    });

    if(!candidates.length){
      /*
        If the current used pool is exhausted,
        reset picker session rather than getting stuck.
      */
      state.random.used = [];

      toast("No new result with these filters. Pool reset.");

      btn.disabled = false;
      btn.textContent = "🎲 PICK FOR ME";

      return;
    }

    /*
      Weighted random:
      popularity + rating give slightly better
      chance to stronger results, while still random.
    */
    const pool = candidates
      .sort((a,b)=>{
        const scoreA =
          Math.random() * 0.7 +
          Number(a.vote_average || 0) / 10 * 0.3;

        const scoreB =
          Math.random() * 0.7 +
          Number(b.vote_average || 0) / 10 * 0.3;

        return scoreB-scoreA;
      });

    const selected =
      pool[Math.floor(Math.random()*Math.min(pool.length,10))];

    const key =
      `${mediaType(selected)}:${selected.id}`;

    state.random.used.push(key);
    state.random.last = selected;

    document.getElementById("randomResultImage").src =
      image(selected.poster_path);

    document.getElementById("randomResultName").textContent =
      titleOf(selected);

    document.getElementById("randomResultMeta").innerHTML = `
      ${mediaType(selected)==="tv"?"TV SHOW":"MOVIE"}
      · ${yearFromDate(dateOf(selected))}
      · <span class="rating">
          ★ ${Number(selected.vote_average||0).toFixed(1)}
        </span>
    `;

    document.getElementById("randomResult")
      .classList.add("show");

  }catch(error){
    console.error(error);
    toast("Random picker couldn't load results.");
  }

  btn.disabled = false;
  btn.textContent = "🎲 PICK FOR ME";
}

    for(let page=1;page<=3;page++){
      const data = await api("/search/multi",{
        query,
        page,
        include_adult:false
      });

      all.push(
        ...(data.results || [])
          .filter(x=>x.media_type==="movie" || x.media_type==="tv")

    updateFilterLabels();

    document.querySelectorAll(".global-media-btn").forEach(function(btn){
      btn.classList.toggle("active", btn.dataset.value === "all");
    });

    const search = document.getElementById("searchInput");
    if(search) search.value = "";

    const suggestions = document.getElementById("searchSuggestions");
    if(suggestions) suggestions.classList.add("hidden");

    if(typeof loadTrending === "function") loadTrending();
    if(typeof loadBrowse === "function") loadBrowse();

    window.scrollTo({top:0,behavior:"smooth"});

    try{
      if(location.hash && location.hash !== "#home"){
        history.pushState({cinevoHome:true},"","#home");
      }
    }catch(e){}
  };

  window.setMainMediaType = async function(type){
    if(!["all","movie","tv"].includes(type)) type="all";

    state.filters.type = type;
    state.page = 1;

    document.querySelectorAll(".global-media-btn").forEach(function(btn){
      btn.classList.toggle("active", btn.dataset.value === type);
    });

    // Keep the existing Browse by Type dropdown synchronized.
    if(typeof updateFilterLabels === "function") updateFilterLabels();

    // Clear search so the whole main page is in the selected browse mode.
    const search = document.getElementById("searchInput");
    if(search) search.value = "";
    document.getElementById("searchSuggestions")?.classList.add("hidden");

    // Refresh both Trending and Browse using the selected type.
    await Promise.allSettled([
      typeof loadTrending === "function" ? loadTrending() : Promise.resolve(),
      typeof loadBrowse === "function" ? loadBrowse() : Promise.resolve()
    ]);

    window.scrollTo({top:0,behavior:"smooth"});
  };

  document.addEventListener("DOMContentLoaded",function(){
    document.querySelectorAll(".global-media-btn").forEach(function(btn){
      btn.classList.toggle("active", btn.dataset.value === (state.filters.type || "all"));
    });
  });
})();
</script>


<script id="cinevo-mobile-trending-fix">
(function(){
  function fixMobileTrending(){
    if (window.innerWidth > 700) return;

    var root = document.getElementById("trendingContainer") ||
               document.getElementById("trendingCard") ||
               document.querySelector(".trending-container");
    if(!root) return;

    var cards = root.querySelectorAll(
      ".trending-card,.trending-recommendation,.trending-feature,.trending-hero,[class*='trending']"
    );

    cards.forEach(function(card){
      if(card.dataset.mobileTrendingFixed === "1") return;

      var img = card.querySelector("img");
      if(!img) return;

      var content = card.querySelector(
        ".trending-content,.content,.trending-info,.hero-content,[class*='content']"
      );

      img.style.setProperty("position","relative","important");
      img.style.setProperty("inset","auto","important");
      img.style.setProperty("display","block","important");
      img.style.setProperty("width","100%","important");
      img.style.setProperty("height","auto","important");
      img.style.setProperty("aspect-ratio","16 / 9","important");
      img.style.setProperty("object-fit","cover","important");
      img.style.setProperty("object-position","center","important");
      img.style.setProperty("transform","none","important");

      if(content){
        content.style.setProperty("position","relative","important");
        content.style.setProperty("inset","auto","important");
        content.style.setProperty("width","100%","important");
        content.style.setProperty("margin","0","important");
        content.style.setProperty("background","var(--card,#11151c)","important");
      }

      card.style.setProperty("overflow","hidden","important");
      card.dataset.mobileTrendingFixed="1";
    });
  }

  document.addEventListener("DOMContentLoaded",fixMobileTrending);
  window.addEventListener("resize",fixMobileTrending);
  new MutationObserver(function(){fixMobileTrending()})
    .observe(document.body,{childList:true,subtree:true});
})();
</script>

\n<script id="cinevo-mobile-search-hub-js">
(function(){
  let ready=false;
  const hub=()=>document.getElementById("cinevoMobileSearchHub");
  const q=()=>document.getElementById("mshQuery");
  function label(type){
    const f=state.filters;
    if(type==="genre") return f.genre==="bollywood" ? "Bollywood" : (f.genre ? getGenreName(f.genre) : "Genre");
    if(type==="year") return f.year || "Year";
    if(type==="country"){ const c=COUNTRIES.find(x=>x[0]===f.country); return c ? c[1] : "Country"; }
    return type;
  }
  function build(){
    if(window.innerWidth>700 || !hub() || ready) return;
    ready=true;
    const typeBox=document.getElementById("mshType");
    typeBox.innerHTML=[["all","ALL"],["movie","MOVIES"],["tv","TV SHOWS"]].map(x=>`<button type="button" data-mtype="${x[0]}">${x[1]}</button>`).join("");
    typeBox.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
      state.filters.type=b.dataset.mtype; state.page=1;
      typeBox.querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));
      // reset genre if a TV-only genre was selected
      if(state.filters.type==="tv" && state.filters.genre && !TV_GENRES.some(g=>String(g[0])===String(state.filters.genre)) && state.filters.genre!=="bollywood") state.filters.genre="";
      buildMenus();
    }));
    buildMenus();
    document.querySelector("#cinevoMobileSearchHub .msh-close")?.addEventListener("click",close);
    document.getElementById("mshApply")?.addEventListener("click",apply);
    q()?.addEventListener("input",onQuery);
    q()?.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();applyQuery();}});
  }
  function buildMenus(){
    const current=state.filters.type||"all";
    const genreSource=current==="tv"?TV_GENRES:current==="movie"?MOVIE_GENRES:[...MOVIE_GENRES,...TV_GENRES].filter((x,i,a)=>a.findIndex(y=>y[0]===x[0])===i);
    const genreMenu=document.querySelector('[data-mfilter="genre"] .msh-menu');
    if(genreMenu){
      const genres=[ ["","All Genres"], ["bollywood","Bollywood"], ...genreSource.map(g=>[String(g[0]),g[1]]) ].filter((x,i,a)=>a.findIndex(y=>y[0]===x[0])===i).sort((a,b)=>a[1].localeCompare(b[1]));
      genreMenu.innerHTML=genres.map(x=>`<button type="button" data-value="${x[0]}">${x[1]}</button>`).join("");
    }
    const yearMenu=document.querySelector('[data-mfilter="year"] .msh-menu');
    if(yearMenu){
      const currentYear=new Date().getFullYear();
      let out=`<button type="button" data-value="">All Years</button>`;
      for(let y=currentYear;y>=1901;y--) out+=`<button type="button" data-value="${y}">${y}</button>`;
      yearMenu.innerHTML=out;
    }
    const countryMenu=document.querySelector('[data-mfilter="country"] .msh-menu');
    if(countryMenu){
      countryMenu.innerHTML=`<button type="button" data-value="">All Countries</button>`+COUNTRIES.slice().sort((a,b)=>a[1].localeCompare(b[1])).map(x=>`<button type="button" data-value="${x[0]}">${x[1]}</button>`).join("");
    }
    document.querySelectorAll("#cinevoMobileSearchHub .msh-filter").forEach(f=>{
      const type=f.dataset.mfilter, button=f.querySelector(".msh-filter-btn"), menu=f.querySelector(".msh-menu");
      button.querySelector("span:first-child").textContent=label(type);
      button.onclick=e=>{e.stopPropagation(); document.querySelectorAll("#cinevoMobileSearchHub .msh-menu").forEach(m=>{if(m!==menu)m.classList.add("hidden")}); menu.classList.toggle("hidden");};
      menu.querySelectorAll("button").forEach(item=>{
        item.onclick=e=>{e.stopPropagation();state.filters[type]=item.dataset.value;menu.querySelectorAll("button").forEach(x=>x.classList.remove("selected"));item.classList.add("selected");button.querySelector("span:first-child").textContent=label(type);menu.classList.add("hidden");};
      });
    });
    document.querySelectorAll("#mshType button").forEach(b=>b.classList.toggle("active",b.dataset.mtype===state.filters.type));
  }
  async function applyQuery(){
    const query=(q()?.value||"").trim();
    if(query){
      closeMenus();
      if(typeof performSearch==="function") await performSearch(query);
    }else{
      await apply();
    }
  }
  async function apply(){
    closeMenus();
    state.page=1;
    const query=(q()?.value||"").trim();
    if(query){
      await applyQuery();
      return;
    }
    if(typeof loadTrending==="function") await loadTrending();
    if(typeof loadBrowse==="function") await loadBrowse();
    document.getElementById("results")?.scrollIntoView({behavior:"smooth",block:"start"});
  }
  function onQuery(){
    // Keep the normal desktop suggestion engine intact; mobile suggestions are intentionally minimal.
  }
  function closeMenus(){document.querySelectorAll("#cinevoMobileSearchHub .msh-menu").forEach(m=>m.classList.add("hidden"));}
  function close(){hub()?.classList.remove("open");closeMenus();}
  window.cinevoInitMobileSearchHub=build;
  document.addEventListener("click",e=>{if(!e.target.closest("#cinevoMobileSearchHub"))closeMenus();});
  document.addEventListener("DOMContentLoaded",()=>{if(window.innerWidth<=700)build();});
})();
</script>\n</body>

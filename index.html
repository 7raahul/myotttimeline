<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie & TV Diary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            color: #e50914;
        }
        .search-container {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            max-width: 400px;
            padding: 10px;
            font-size: 16px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .card {
            background: #1e1e1e;
            border-radius: 6px;
            overflow: hidden;
            text-align: center;
            padding-bottom: 10px;
        }
        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .card h4 {
            font-size: 14px;
            margin: 10px 5px;
            height: 40px;
            overflow: hidden;
        }
        button {
            background: #e50914;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
        }
        button:hover {
            background: #b20710;
        }
        .timeline-section {
            margin-top: 40px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <h1>My Movie & Series Diary</h1>

    <!-- Search Section -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search movie or TV show..." oninput="searchMovies()">
    </div>
    <div id="searchResults" class="grid"></div>

    <!-- Trending Section -->
    <h2>Trending Today</h2>
    <div id="trendingGrid" class="grid"></div>

    <!-- Timeline / Watched Diary -->
    <div class="timeline-section">
        <h2>My Watched Diary (Timeline)</h2>
        <div id="diaryGrid" class="grid"></div>
    </div>

    <script>
        const API_KEY = '9c95420163879f1c4726c540b305cbc6';
        const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';

        // Load Trending Movies on Startup
        async function loadTrending() {
            try {
                const response = await fetch(`https://api.themoviedb.org/3/trending/all/day?api_key=${API_KEY}`);
                const data = await response.json();
                displayMovies(data.results, 'trendingGrid', true);
            } catch (error) {
                console.error('Error fetching trending:', error);
            }
        }

        // Search Movies & Shows
        async function searchMovies() {
            const query = document.getElementById('searchInput').value;
            const resultsDiv = document.getElementById('searchResults');
            
            if (query.trim() === '') {
                resultsDiv.innerHTML = '';
                return;
            }

            try {
                const response = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
                const data = await response.json();
                displayMovies(data.results, 'searchResults', true);
            } catch (error) {
                console.error('Error searching:', error);
            }
        }

        // Display Movies in Grid
        function displayMovies(movies, elementId, showAddButton = false) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';

            movies.forEach(movie => {
                if (!movie.poster_path) return; // Skip if no poster

                const title = movie.title || movie.name;
                const date = movie.release_date || movie.first_air_date || 'N/A';
                const year = date.split('-')[0];

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${IMAGE_BASE_URL + movie.poster_path}" alt="${title}">
                    <h4>${title} (${year})</h4>
                    ${showAddButton ? `<button onclick='addToDiary(${JSON.stringify(movie).replace(/'/g, "&apos;")})'>Add to Diary</button>` : ''}
                `;
                container.appendChild(card);
            });
        }

        // Add to Watched Diary (Saved in LocalStorage)
        function addToDiary(movie) {
            let diary = JSON.parse(localStorage.getItem('myMovieDiary')) || [];
            
            // Check if already added
            if (!diary.some(item => item.id === movie.id)) {
                diary.push(movie);
                localStorage.setItem('myMovieDiary', JSON.stringify(diary));
                loadDiary();
                alert(`${movie.title || movie.name} added to your diary!`);
            } else {
                alert('This is already in your diary.');
            }
        }

        // Load Watched Diary
        function loadDiary() {
            let diary = JSON.parse(localStorage.getItem('myMovieDiary')) || [];
            displayMovies(diary, 'diaryGrid', false);
        }

        // Run on page load
        loadTrending();
        loadDiary();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVault - Letterboxd Style</title>
    <style>
        :root {
            --bg-color: #14181c;
            --card-bg: #1b222c;
            --accent: #00e054;
            --accent-hover: #00c046;
            --text-main: #9ab;
            --text-white: #fff;
            --border-color: #2c3440;
            --danger: #ff8000;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 10px;
        }
        .wrapper {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 {
            color: var(--text-white);
            margin: 0;
            font-size: 24px;
            font-weight: 800;
        }
        h1 span { color: var(--accent); }
        
        .search-container {
            margin-bottom: 30px;
            text-align: center;
        }
        input[type="text"] {
            width: 100%;
            max-width: 600px;
            padding: 14px 20px;
            font-size: 15px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
        }
        input[type="text"]:focus { border-color: var(--accent); }

        .section-title {
            margin: 35px 0 15px 0;
            font-size: 18px;
            color: var(--text-white);
            font-weight: 700;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; }
        }
        .card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            border: 2px solid transparent;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }
        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .card h4 {
            font-size: 13px;
            margin: 10px 8px;
            height: 32px;
            overflow: hidden;
            color: var(--text-white);
        }

        .content-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
        }

        /* Letterboxd Style Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 13, 16, 0.9);
            backdrop-filter: blur(8px);
            overflow-y: auto;
        }
        .modal-content {
            background-color: #12181f;
            margin: 3% auto;
            width: 92%;
            max-width: 800px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        .close-btn {
            color: #fff;
            position: absolute;
            right: 15px;
            top: 15px;
            font-size: 20px;
            background: rgba(0,0,0,0.6);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            border: 1px solid var(--border-color);
        }
        .close-btn:hover { background: var(--danger); }

        /* Letterboxd Banner Layout */
        .lb-banner {
            position: relative;
            width: 100%;
            height: 240px;
            background-size: cover;
            background-position: center;
        }
        @media (min-width: 768px) {
            .lb-banner { height: 350px; }
        }
        .lb-banner::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 100px;
            background: linear-gradient(to top, #12181f, transparent);
        }
        .lb-header-details {
            padding: 0 20px 20px 20px;
            margin-top: -50px;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        @media (min-width: 600px) {
            .lb-header-details { flex-direction: row; align-items: flex-end; justify-content: space-between; }
        }
        .lb-title-group h2 {
            margin: 0 0 5px 0;
            color: var(--text-white);
            font-size: 22px;
            font-weight: 800;
        }
        @media (min-width: 768px) {
            .lb-title-group h2 { font-size: 30px; }
        }
        .lb-title-group p {
            margin: 0;
            font-size: 14px;
            color: var(--text-main);
        }
        .lb-poster-thumb {
            width: 100px;
            height: 150px;
            border-radius: 6px;
            border: 2px solid #fff;
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            display: none;
        }
        @media (min-width: 600px) {
            .lb-poster-thumb { display: block; }
        }

        /* Letterboxd Action Bar (Watch, Like, Watchlist) */
        .lb-action-bar {
            display: flex;
            justify-content: space-around;
            background: #18202a;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 0;
        }
        .lb-action-btn {
            background: none;
            border: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: color 0.2s;
        }
        .lb-action-btn svg { width: 22px; height: 22px; fill: currentColor; }
        .lb-action-btn:hover, .lb-action-btn.active { color: var(--accent); }

        /* Rating Stars Section */
        .lb-rating-section {
            text-align: center;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        .stars {
            display: inline-flex;
            gap: 5px;
            cursor: pointer;
            font-size: 24px;
            color: #456;
        }
        .stars span.active { color: #00e054; }

        .lb-body-section {
            padding: 20px;
        }
        .cast-row {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .cast-item {
            min-width: 75px;
            text-align: center;
            font-size: 11px;
        }
        .cast-item img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <h1>Cine<span>Vault</span></h1>
            <div id="syncStatus" style="font-size: 13px; color: var(--accent);">🟢 Synced</div>
        </header>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search movies, tv series..." oninput="searchMovies()">
        </div>
        <div id="searchResults" class="grid"></div>

        <div class="content-section">
            <h2 class="section-title" style="margin-top:0;">🔥 Trending Masterpieces</h2>
            <div id="trendingGrid" class="grid"></div>
        </div>
    </div>

    <!-- Letterboxd Style Modal -->
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const TMDB_API_KEY = '9c95420163879f1c4726c540b305cbc6';
        const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';
        const BACKDROP_BASE_URL = 'https://image.tmdb.org/t/p/original';

        loadTrending();

        async function loadTrending() {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/trending/all/week?api_key=${TMDB_API_KEY}`);
                const data = await res.json();
                displayMovies(data.results, 'trendingGrid');
            } catch (err) {
                console.error(err);
            }
        }

        async function searchMovies() {
            const query = document.getElementById('searchInput').value;
            const resultsDiv = document.getElementById('searchResults');
            if (!query.trim()) { resultsDiv.innerHTML = ''; return; }

            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`);
                const data = await res.json();
                displayMovies(data.results, 'searchResults');
            } catch (err) { console.error(err); }
        }

        function displayMovies(movies, elementId) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';
            movies.forEach(movie => {
                if (!movie.poster_path) return;
                const title = movie.title || movie.name;
                const date = movie.release_date || movie.first_air_date || '';
                const year = date ? date.split('-')[0] : '';
                const mediaType = movie.media_type || (movie.title ? 'movie' : 'tv');

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openDetails(movie.id, mediaType);
                card.innerHTML = `
                    <img src="${IMAGE_BASE_URL + movie.poster_path}" alt="${title}">
                    <h4>${title} ${year ? '('+year+')' : ''}</h4>
                `;
                container.appendChild(card);
            });
        }

        async function openDetails(id, type) {
            const modal = document.getElementById('detailsModal');
            const modalBody = document.getElementById('modalBody');
            modal.style.display = 'block';
            modalBody.innerHTML = '<p style="text-align:center; padding:40px; color:var(--accent);">Loading...</p>';

            try {
                const [detailRes, creditRes] = await Promise.all([
                    fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${TMDB_API_KEY}`),
                    fetch(`https://api.themoviedb.org/3/${type}/${id}/credits?api_key=${TMDB_API_KEY}`)
                ]);
                const details = await detailRes.json();
                const credits = await creditRes.json();

                const title = details.title || details.name;
                const year = (details.release_date || details.first_air_date || '').split('-')[0];
                const backdrop = details.backdrop_path ? BACKDROP_BASE_URL + details.backdrop_path : '';
                const poster = details.poster_path ? IMAGE_BASE_URL + details.poster_path : '';
                const director = credits.crew ? (credits.crew.find(c => c.job === 'Director') || {}).name : 'N/A';
                const cast = credits.cast ? credits.cast.slice(0, 10) : [];

                modalBody.innerHTML = `
                    <div class="lb-banner" style="background-image: url('${backdrop}')"></div>
                    <div class="lb-header-details">
                        <div class="lb-title-group">
                            <h2>${title}</h2>
                            <p>${year} ${director !== 'nic' && director ? '· Directed by ' + director : ''}</p>
                        </div>
                        <img src="${poster}" class="lb-poster-thumb" alt="${title}">
                    </div>

                    <div class="lb-action-bar">
                        <button class="lb-action-btn" onclick="toggleAction(this)">
                            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                            Watch
                        </button>
                        <button class="lb-action-btn" onclick="toggleAction(this)">
                            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            Like
                        </button>
                        <button class="lb-action-btn" onclick="toggleAction(this)">
                            <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15l-5-2.18L7 18V5h10v13z"/></svg>
                            Watchlist
                        </button>
                    </div>

                    <div class="lb-rating-section">
                        <div class="stars" id="starContainer">
                            <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
                        </div>
                        <div style="font-size: 11px; margin-top: 5px; color: var(--text-main);">Rate</div>
                    </div>

                    <div class="lb-body-section">
                        <h3 style="color:#fff; font-size:15px; margin-top:0;">Overview</h3>
                        <p style="font-size:13px; line-height:1.5; color: var(--text-main);">${details.overview || 'No description available.'}</p>
                        
                        <h3 style="color:#fff; font-size:15px; margin-top:20px;">Top Cast</h3>
                        <div class="cast-row">
                            ${cast.map(actor => `
                                <div class="cast-item">
                                    <img src="${actor.profile_path ? IMAGE_BASE_URL + actor.profile_path : 'https://via.placeholder.com/70'}" alt="${actor.name}">
                                    <div style="margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${actor.name}">${actor.name}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;

                setupStarRating();
            } catch (err) {
                modalBody.innerHTML = '<p style="text-align:center; color:orange; padding:30px;">Failed to load details.</p>';
            }
        }

        function toggleAction(btn) {
            btn.classList.toggle('active');
        }

        function setupStarRating() {
            const stars = document.querySelectorAll('#starContainer span');
            stars.forEach((star, index) => {
                star.onclick = () => {
                    stars.forEach((s, i) => {
                        if (i <= index) s.classList.add('active');
                        else s.classList.remove('active');
                    });
                };
            });
        }

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
        }
    </script>
</body>
</html>
